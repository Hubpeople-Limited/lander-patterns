name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and all refs. The version-bump check compares each
          # pattern against the merge base with origin/main, and a shallow
          # checkout has no origin/main at all - the check then found no base
          # and returned silently, so it never ran anywhere it mattered.
          fetch-depth: 0
      - name: Make origin/main resolvable
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Regenerates INDEX.md as part of validation, so a contributor in the
      # web editor never has to touch it - the release job commits the
      # regenerated copy on merge.
      - name: Check what this pull request says in public
        if: github.event_name == 'pull_request'
        env:
          LANDER_LEAK_NEEDLES: ${{ secrets.LANDER_LEAK_NEEDLES }}
          LANDER_LEAK_SKIP: ${{ github.event.pull_request.head.repo.fork }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python ci/check_prose.py --range origin/main...HEAD
          # Through the environment, never interpolated into the script: a
          # pull request title is text a stranger wrote.
          { echo "$PR_TITLE"; echo; echo "$PR_BODY"; } > pr-text.tmp
          python ci/check_prose.py --file pr-text.tmp
          rm -f pr-text.tmp
      - name: Lint patterns (regenerates INDEX.md)
        env:
          # The strings that must never reach a public file are not in this
          # repo in any form. Without the list the scan refuses to report
          # clean rather than passing silently.
          #
          # GitHub does not pass secrets to a pull request raised from a fork,
          # so on those runs the variable arrives empty and the scan cannot
          # run. That must not fail a contributor's build for something they
          # cannot fix, and it must not pass silently either: the scan is
          # skipped explicitly here and runs on the push to main, before
          # anything is released. LANDER_LEAK_SKIP is honoured only when it is
          # a fork PR, which the expression below decides, never by the
          # linter's own logic.
          LANDER_LEAK_NEEDLES: ${{ secrets.LANDER_LEAK_NEEDLES }}
          LANDER_LEAK_SKIP: ${{ github.event.pull_request.head.repo.fork }}
        run: python ci/lint.py
      # compositions/ is generated output committed to the repo, like
      # INDEX.md. Unlike INDEX.md it is not regenerated here on the fly:
      # a shell an agent already fetched is a contract, so a pattern or
      # recipe change that alters one has to fail loudly until somebody
      # runs ci/compose.py and commits what it wrote - stale output on
      # main would be a page that contradicts the patterns it names.
      - name: Compositions match the recipes and patterns they are built from
        run: python ci/compose.py --check
      # ci/check_phone.py renders patterns in a real browser. Without one it
      # skips and exits 0, which is right for a contributor in the web editor
      # and wrong here - CI is the run that has to actually measure. Install
      # the browser, and let the step fail loudly if the install does, rather
      # than sliding into a green build that checked nothing.
      - name: Install the browser the phone-width gate needs
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      # The gate tests, both directions: every fault fires and every
      # valid form stays quiet. Added because the suite existed and
      # nothing ran it, which is a test file and no test.
      - name: Check the gates still catch what they claim
        run: python ci/test_gates.py
      # Belt and braces on the step above: test_gates.py treats "no browser"
      # as a skip, so if the install ever degrades, the suite goes green
      # having measured nothing. --require-browser turns that skip into a
      # failure, which is the correct reading HERE and only here.
      - name: Confirm the phone-width gate actually ran
        run: python ci/check_phone.py --require-browser
      # The same patterns again, on the sample brand whose heading face this
      # library was NOT designed against. The four other sample sets name a
      # system stack - Georgia twice, Helvetica/Arial twice - so until
      # preview/tokens-display.css existed, every render in this workflow was
      # a render on a face the CSS had been tuned to.
      - name: Phone widths on the hostile type fixture
        run: python ci/check_phone.py --require-browser --tokens display
      # Every display measure, on all five sample brands, required to resolve
      # to the same number of pixels. This is what holds the v57 ch-to-em move
      # true: `ch` is the advance of zero in whichever face the brand chose,
      # so a measure written in it is a headline that breaks to a different
      # number of lines per brand. --require-browser for the same reason as
      # the step above.
      - name: Display measures agree across every sample brand
        run: python ci/check_measures.py --require-browser
      # The positive control, and it is not optional. The step above passes on
      # a library where nothing is measured at all, so this one re-renders
      # every display measure in the pre-v57 `ch` form and requires the check
      # to fire. Exit 0 here means the defect was detected.
      - name: Confirm the measure gate can still catch a ch measure
        run: python ci/check_measures.py --require-browser --as-ch
      # A full-viewport pattern in a page assembled the way the platform
      # serves one: this library's own masthead-nav above it and a stand-in
      # site footer below. Every other gate here measures a pattern alone, and
      # a pattern alone has no footer under it - which is how a squeeze page
      # whose whole premise is one viewport shipped 177px of scroll.
      - name: Full-viewport patterns fit a page with real furniture
        run: python ci/check_fold.py --require-browser
      # The positive control, and it is not optional for the same reason the
      # measure one is not: the step above passes on a gate that assembles
      # nothing. This one puts the furniture tokens back the way the live
      # defect had them - a header allowance derived from a logo, no footer
      # allowance at all - and requires the check to fire. Exit 0 here means
      # the defect was detected.
      - name: Confirm the fold gate can still catch a missing footer
        run: python ci/check_fold.py --require-browser --broken
      # And again on the sample brand whose heading face this library was not
      # designed against. A header height is a size in a particular typeface:
      # masthead-nav renders 124px on Georgia and 145px on the display fixture
      # at the same width, and the allowance the openers ship has to cover the
      # taller one.
      - name: The fold on the hostile type fixture
        run: python ci/check_fold.py --require-browser --tokens display
      # The brand mark, rendered as the shapes brands actually ship it in.
      # Every sample image in this repo carries width and height attributes; a
      # real brand logo is an SVG with a viewBox and nothing else, which has a
      # ratio and no intrinsic size. masthead-nav sized it under two ceilings
      # and it resolved to 0x0 below 60rem - no brand mark on any phone or
      # tablet, on every page built from any of the shells, with every gate
      # here green.
      - name: The brand mark is drawn at the size the header reserved
        run: python ci/check_logo.py --require-browser
      # And on the hostile type fixture, whose --logo-height is a different
      # number: the check compares what was drawn against what that token
      # resolved to on the page, so it has to be run somewhere it is not 44px.
      - name: The brand mark on the hostile type fixture
        run: python ci/check_logo.py --require-browser --tokens display
      # The positive control, not optional, for the reason the other two are
      # not: the steps above pass on a gate that measures nothing. This one
      # puts the logo rule back the way the defect had it and requires the
      # check to fire. Exit 0 here means the defect was detected.
      - name: Confirm the logo gate can still catch a mark that is not drawn
        run: python ci/check_logo.py --require-browser --broken
      - name: Legibility
        run: python ci/legibility.py
      - name: Build previews
        run: python ci/build_preview.py
      # The machine-readable bundle, written into the same directory the
      # previews go to, so Pages serves it from a stable URL with the
      # `Access-Control-Allow-Origin: *` header it already sends. A consumer in
      # a browser then makes one fetch instead of thirty, and gets whatever the
      # current release is without anybody maintaining a copy of this library
      # somewhere else. Deliberately NOT added to the release zip: everything
      # in it is derived from files already in that zip, and two copies of one
      # library are two things free to disagree.
      - name: Build the configurator bundle
        run: python ci/build_configurator.py
      # On a PR the previews are attached as a downloadable artifact so the
      # contributor can review both feels without local tooling; on main they
      # go to Pages.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: pattern-previews
          path: preview/site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: preview/site

  release:
    # Every merge to main becomes the release agents fetch: regenerate
    # INDEX.md, point LATEST at the new tag, commit, tag that commit.
    # Requires the repo to allow this workflow to push to main (see the
    # maintainer setup notes in CONTRIBUTING.md).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate INDEX, update LATEST, commit and tag
        env:
          # The release job runs the same linter, so it needs the same secret.
          # Without it the leak scan refuses to pass, lint exits 1, and the
          # step aborts before LATEST is written or the tag is cut - no
          # release at all, which is how this was left after the scan was
          # externalised.
          LANDER_LEAK_NEEDLES: ${{ secrets.LANDER_LEAK_NEEDLES }}
        run: |
          TAG="v${{ github.run_number }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to do"
            exit 0
          fi
          git pull --rebase origin main
          python ci/lint.py
          python ci/test_gates.py
          echo "$TAG" > LATEST
          # compositions/ stamps the library tag into each manifest.json and
          # nowhere else, so regenerating after LATEST moves rewrites one
          # file per composition; they ship in the release commit, the same
          # treatment INDEX.md gets, for the same reason.
          python ci/compose.py
          git config user.name "pattern-ci"
          git config user.email "pattern-ci@users.noreply.github.com"
          # patterns.json too. It is regenerated by the lint run above and
          # was never staged, so every commit of it in this repo's history is
          # a hand-run - which left the file agents fetch to choose patterns
          # only as current as someone's last local run.
          git add INDEX.md LATEST patterns.json compositions
          git commit -m "ci: release $TAG [skip ci]" || true
          git tag "$TAG"
          git push --atomic origin main "refs/tags/$TAG"
      # One download instead of thirty fetches: everything a consumer reads,
      # zipped and attached to a GitHub Release for the tag. Idempotent on
      # re-runs: the checkout on a re-run is the SHA from before the release
      # commit existed, so the tagged tree - the asset's content by
      # definition - is checked out explicitly before zipping, and an
      # existing release just gets the same asset replaced.
      - name: Attach the library bundle to a release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          git fetch --tags origin
          git checkout "refs/tags/$TAG"
          zip -qr "library-$TAG.zip" patterns compositions lib INDEX.md TOKENS.md patterns.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "library-$TAG.zip" --clobber
          else
            gh release create "$TAG" "library-$TAG.zip" --title "$TAG" \
              --notes "The whole library at $TAG in one download: patterns/, compositions/, lib/, INDEX.md, TOKENS.md, patterns.json."
          fi

  publish-preview:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

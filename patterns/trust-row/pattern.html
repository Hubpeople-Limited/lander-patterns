<!--
name: trust-row
version: 2
type: component
page-types: homepage, landing, pricing, safety
content-shape: peer set
description: Hairline-bracketed strip of assurance marks - a membership lockup beside a row of icon-over-label compliance badges, answering whether the brand is legitimate at the point of sign-up.
keywords: trust, compliance, assurance, badges, membership, safety, security
needs: real, verifiable compliance marks or memberships the brand actually holds and nothing else - the supplied membership logo file with its real alt text, the association's real name, the real membership status, and the real name of each certification or regulation the brand can evidence
pairs-with: pricing-tiers, faq-details
avoid-with: none
tokens-used: --chip-radius, --color-primary-dark, --color-rule, --color-surface-soft, --color-text, --color-text-soft, --font-body, --space-1, --space-12, --space-2, --space-3, --space-5, --space-6, --space-8
motion: none
one-per-page: yes
status: active
added: 2026-08-22
-->
<div class="trust-row">
  <!-- The membership lockup. A real association logo is a supplied asset, so
       the mark is an image slot - never redraw one, and set width and height
       to the real file's pixel dimensions. Delete this whole
       trust-row-membership block if the brand belongs to no association. -->
  <div class="trust-row-membership">
    <img class="trust-row-mark" src="slot:membership-mark" alt="slot:membership-mark-alt" width="76" height="76" loading="lazy">
    <p class="trust-row-membership-name">
      <!-- slot: membership-name -->
      <span class="trust-row-membership-status"><!-- slot: membership-status --></span>
    </p>
  </div>
  <!-- ONE <li> per mark the brand can actually evidence: keep those, delete
       the rest, and add nothing the brand has not earned. The three icons are
       interchangeable - move a <path>/<rect> set from one <li> to another to
       suit its label. -->
  <ul class="trust-row-badges" role="list">
    <li class="trust-row-badge">
      <span class="trust-row-badge-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5z"></path></svg></span>
      <!-- slot: badge-1-label -->
    </li>
    <li class="trust-row-badge">
      <span class="trust-row-badge-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span>
      <!-- slot: badge-2-label -->
    </li>
    <li class="trust-row-badge">
      <span class="trust-row-badge-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M9 12l2 2 4-4"></path></svg></span>
      <!-- slot: badge-3-label -->
    </li>
  </ul>
</div>

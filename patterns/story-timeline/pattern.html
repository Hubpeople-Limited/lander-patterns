<!-- Layout: --centre or --start.
     Photographs: --with or --without.
     Background: --plain or --soft. -->
<!-- One moment per <li>, in date order: duplicate the whole <li>. Three to
     eight read best. Each moment is the couple's own, with the date they
     gave: datetime takes it as 2019, 2019-06 or 2019-06-14, and the date
     shown is the year alone unless they asked for more. Delete the line
     when they gave none, and the photograph when there is none: the moment
     closes up. section-id: draw it from the heading. -->
<section class="story-timeline story-timeline--centre story-timeline--with story-timeline--plain" aria-labelledby="slot:section-id">
  <div class="story-timeline-inner">
    <p class="story-timeline-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="story-timeline-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <ol class="story-timeline-list" role="list" data-hub-module="reveal" data-hub-reveal-children>
      <li class="story-timeline-item">
        <div class="story-timeline-body">
          <time class="story-timeline-num" datetime="slot:moment-datetime"><!-- slot: moment-when --></time>
          <h3 class="story-timeline-name"><!-- slot: moment-title --></h3>
          <p class="story-timeline-line"><!-- slot: moment-line --></p>
        </div>
        <img class="story-timeline-img" src="slot:moment-image" alt="slot:moment-image-alt" width="1200" height="900" loading="lazy" decoding="async">
      </li>
    </ol>
  </div>
</section>

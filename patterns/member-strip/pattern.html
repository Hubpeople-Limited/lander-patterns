<!-- ONE member. Duplicate the whole <li>; four to eight is the useful range,
     and below four it reads as the only four the brand has.

     alt is empty on purpose and must stay empty: the name sits beside the
     photograph and carries it, so describing the face again is noise. The
     meta line is optional - delete the span where there is nothing true and
     short to put in it. -->
<div class="member-strip">
  <p class="member-strip-lead"><!-- slot: lead --></p>
  <ul class="member-strip-list" role="list">
    <li class="member-strip-item">
      <img class="member-strip-photo" src="slot:member-photo" alt="" width="72" height="72" loading="lazy">
      <span class="member-strip-name"><!-- slot: member-name --></span>
      <span class="member-strip-meta"><!-- slot: member-meta --></span>
    </li>
  </ul>
</div>

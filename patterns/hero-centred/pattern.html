<!--
name: hero-centred
version: 2
type: section
page-types: homepage, landing
content-shape: single claim
description: Opener with the claim centred above a wide cropped photograph in its own band - the one hero that never lays a word over an image, so no scrim has to carry a ratio.
keywords: hero, centred, opener, above-the-fold, no-scrim
needs: a headline of one or two lines and one supporting sentence, both from real brand material; one landscape photograph at least 1600px wide with its own alt text and a CDN srcset ladder
pairs-with: picker-chips, stats-band, steps-plain
avoid-with: article-masthead, hero-overlay, hero-split, hero-squeeze
tokens-used: --btn-radius, --card-radius, --color-focus, --color-heading, --color-on-primary, --color-primary, --color-surface-soft, --color-text-soft, --container-max, --font-heading, --space-3, --space-4, --space-5, --space-6, --space-8
motion: none
one-per-page: yes
status: active
added: 2026-08-22
-->
<section class="hero-centred">
  <div class="hero-centred-copy">
    <!-- The page's only h1. -->
    <h1 class="hero-centred-title"><!-- slot: headline --></h1>
    <p class="hero-centred-sub"><!-- slot: subhead --></p>
    <a class="hero-centred-btn" href="{{join.url}}">{{join.text}}</a>
  </div>
  <!-- No word is ever laid over this image, so it takes real alt text and
       needs no scrim. It is still the page's LCP element: never lazy, high
       fetch priority, and width/height carrying the real file's intrinsic
       pixel size so the box is reserved before a byte arrives. Fill srcset
       with a CDN ladder; sizes matches the band, which is capped at the
       container rather than full-bleed. -->
  <div class="hero-centred-media">
    <img class="hero-centred-img"
         src="slot:hero-image"
         srcset="slot:hero-image-srcset"
         sizes="(min-width: 78rem) 72rem, 100vw"
         alt="slot:hero-image-alt"
         width="1600"
         height="900"
         fetchpriority="high"
         decoding="async">
  </div>
</section>

<!-- Take one ground modifier: --plain, --soft or --brand.
     EVERY section-id must differ; two of these on one page is a stated use.
     Duplicate listing-rows-item for each real entry; five is the floor.
     TWO ATTRIBUTE COLUMNS SHIP. Delete what the material cannot fill, from
     every row and from the grid's column count in the same pass. -->
<section class="listing-rows listing-rows--plain" aria-labelledby="slot:section-id">
  <div class="listing-rows-inner">
    <h2 class="listing-rows-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <p class="listing-rows-intro"><!-- slot: section-intro --></p>
    <ul class="listing-rows-list" role="list">
      <li class="listing-rows-item">
        <a class="listing-rows-link" href="slot:entry-url"><!-- slot: entry-title --></a>
        <span class="listing-rows-meta"><!-- slot: entry-meta --></span>
        <span class="listing-rows-when"><!-- slot: entry-when --></span>
        <p class="listing-rows-summary"><!-- slot: entry-summary --></p>
      </li>
    </ul>
  </div>
</section>

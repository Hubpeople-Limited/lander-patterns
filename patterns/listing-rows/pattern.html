keywords: index, list, rows, directory, articles, guides, catalogue, no-photography
needs: five or more real destinations or items of the same kind, each with the brand's own title, one true sentence about it, and at least one genuine attribute per row - a date, a category, a place, a count. Every link resolves to a page that already has content on it. An attribute column is deleted rather than filled with something invented

<!-- Take one ground modifier: --plain, --soft or --brand. See the README.

     Duplicate the whole listing-rows-item for each real entry. Five is the
     floor; below that this reads as a stub rather than an index.

     TWO ATTRIBUTE COLUMNS SHIP. Delete the ones the material cannot fill,
     from every row and from the grid's column count in the same pass - a
     column of blanks says the brand does not know its own catalogue. -->
<section class="listing-rows listing-rows--plain" aria-labelledby="slot:section-id">
  <div class="listing-rows-inner">
    <h2 class="listing-rows-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <p class="listing-rows-intro"><!-- slot: section-intro --></p>
    <ul class="listing-rows-list" role="list">
      <li class="listing-rows-item">
        <a class="listing-rows-link" href="slot:entry-url"><!-- slot: entry-title --></a>
        <p class="listing-rows-summary"><!-- slot: entry-summary --></p>
        <span class="listing-rows-meta"><!-- slot: entry-meta --></span>
        <span class="listing-rows-when"><!-- slot: entry-when --></span>
      </li>
    </ul>
  </div>
</section>

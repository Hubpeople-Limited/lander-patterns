<!-- Card sizes: --feature or --even.
     Where the words sit: --below or --over. -->
<!-- One card per place, event or idea: duplicate the whole <li>. Three
     read best, and the large-and-small size is drawn for three. Each card
     reads best as something real the brand is about. Delete the line when
     nothing true fills it. section-id: draw it from the heading. -->
<section class="scene-cards scene-cards--feature scene-cards--below" aria-labelledby="slot:section-id">
  <div class="scene-cards-inner">
    <p class="scene-cards-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="scene-cards-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <ul class="scene-cards-list" role="list" data-hub-module="reveal" data-hub-reveal-children>
      <li class="scene-cards-item">
        <figure class="scene-cards-figure">
          <div class="scene-cards-frame">
            <img class="scene-cards-img" src="slot:card-image" alt="slot:card-image-alt" width="960" height="1200" loading="lazy" decoding="async">
          </div>
          <figcaption class="scene-cards-caption">
            <h3 class="scene-cards-name"><!-- slot: card-name --></h3>
            <p class="scene-cards-where"><!-- slot: card-where --></p>
            <p class="scene-cards-line"><!-- slot: card-line --></p>
          </figcaption>
        </figure>
      </li>
    </ul>
  </div>
</section>

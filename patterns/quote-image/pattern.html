<!-- Where the words sit: --centre, --start or --end.
     How much of the photograph the shade covers: --fade or --full. -->
<!-- The quote goes in word for word. A scene reads best behind it. Delete
     the eyebrow and the detail line when nothing true fills them. Loading
     is lazy: this section is not the page's first picture. -->
<section class="quote-image quote-image--centre quote-image--fade">
  <img class="quote-image-img" data-hub-module="reveal" src="slot:quote-backdrop" alt="slot:quote-backdrop-alt" width="2000" height="1125" loading="lazy" decoding="async">
  <figure class="quote-image-words">
    <p class="quote-image-eyebrow"><!-- slot: eyebrow --></p>
    <blockquote class="quote-image-quote">
      <p><!-- slot: quote --></p>
    </blockquote>
    <figcaption class="quote-image-by">
      <p class="quote-image-name"><!-- slot: person-name --></p>
      <p class="quote-image-role"><!-- slot: person-role --></p>
    </figcaption>
  </figure>
</section>

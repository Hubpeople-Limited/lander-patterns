<!-- The visitor scrolls or swipes; nothing moves by itself. Duplicate one
     gallery-scroll-item per real image. tabindex="0" keeps the scroller
     keyboard-reachable; the label tells assistive tech what it is. -->
<div class="gallery-scroll" tabindex="0" role="region" aria-label="slot:gallery-label" data-hub-module="carousel" data-hub-carousel-prev-label="slot:previous-label" data-hub-carousel-next-label="slot:next-label">
  <ul class="gallery-scroll-track" role="list">
    <li class="gallery-scroll-item">
      <img src="slot:image" alt="slot:image-alt" width="480" height="360" loading="lazy">
      <p class="gallery-scroll-caption"><!-- slot: caption --></p>
    </li>
  </ul>
</div>

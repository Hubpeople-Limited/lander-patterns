<section class="benefit-tiles">
  <!-- tabindex="0" keeps the track reachable: below 48rem it scrolls, and
       not every engine makes a scrolling region focusable on its own. -->
  <ul class="benefit-tiles-track" role="list" tabindex="0"
      aria-label="slot:track-label"
      data-hub-module="reveal" data-hub-reveal-children>
    <!-- ONE tile. Duplicate this whole <li> to four: the row is four wide and
         drops to two, so any other count leaves a hole in it. The badge takes
         a real icon file - set width and height to its intrinsic pixel size,
         and give it alt text only where the title does not already say the
         same thing, otherwise alt="". The <h3> expects an <h2> above the
         section, which is what heading-block supplies. -->
    <li class="benefit-tiles-item">
      <!-- The glyph is drawn, not fetched, so it takes the badge's ink and
           stays legible whatever the brand sets. Replace the path data with
           the real mark; keep stroke="currentColor" and add no fill. -->
      <span class="benefit-tiles-badge" aria-hidden="true">
        <svg class="benefit-tiles-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
             stroke-linejoin="round" focusable="false">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
      </span>
      <div class="benefit-tiles-text">
        <h3 class="benefit-tiles-title"><!-- slot: tile-title --></h3>
        <p class="benefit-tiles-copy"><!-- slot: tile-copy --></p>
      </div>
    </li>
  </ul>
</section>

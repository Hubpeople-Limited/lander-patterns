<!-- Place as the page's last content block, before the footer. Delete the
     eyebrow when there is nothing true to put in it. -->
<section class="cta-band" aria-labelledby="slot:cta-band-id">
  <div class="cta-band-inner">
    <p class="cta-band-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="cta-band-title" id="slot:cta-band-id"><!-- slot: title --></h2>
    <p class="cta-band-lead"><!-- slot: lead --></p>
    <a class="cta-band-btn" href="{{join.url}}">{{join.text}}</a>
  </div>
</section>

needs: one claim the section is about, said in a title and at most two sentences - short enough to sit inside a phone-height panel and stay there. Then three or more real items that are the evidence for it, each with its own subheading and a paragraph from real material. Fewer than three and there is nothing to scroll past

<!-- Take one ground modifier: --plain or --soft. Both sides share it.

     Duplicate the whole anchored-split-entry for each real item; three is
     the floor. Delete the eyebrow when nothing true fills it.

     KEEP THE ANCHOR SHORT - a title and at most two sentences. A panel
     taller than the viewport sticks at the top and its own foot can never
     be scrolled to. -->
<section class="anchored-split anchored-split--plain" aria-labelledby="slot:section-id">
  <div class="anchored-split-inner">
    <div class="anchored-split-anchor">
      <p class="anchored-split-eyebrow"><!-- slot: eyebrow --></p>
      <h2 class="anchored-split-title" id="slot:section-id"><!-- slot: claim --></h2>
      <p class="anchored-split-lede"><!-- slot: lede --></p>
    </div>
    <div class="anchored-split-flow">
      <article class="anchored-split-entry">
        <h3 class="anchored-split-entry-title"><!-- slot: entry-title --></h3>
        <p class="anchored-split-entry-body"><!-- slot: entry-body --></p>
      </article>
    </div>
  </div>
</section>

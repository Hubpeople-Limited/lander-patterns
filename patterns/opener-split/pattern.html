<!-- The alternative to heading-block, not a companion to it: pick one opener
     style and hold it down the page. See the README.
     Add opener-split--ruled for a hairline under the block where the opener
     needs separating from what follows. Delete the eyebrow and the intro
     when there is nothing true to put in them. -->
<div class="opener-split">
  <div class="opener-split-lead">
    <p class="opener-split-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="opener-split-title"><!-- slot: title --></h2>
  </div>
  <p class="opener-split-intro"><!-- slot: intro --></p>
</div>

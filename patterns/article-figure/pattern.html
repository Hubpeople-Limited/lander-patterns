<!-- Between two runs of body copy. width and height are a stand-in 16:9 -
     replace them with the real file's pixel dimensions so the browser
     reserves the right box and the text below it does not jump.
     alt describes the picture and is never empty here: a picture worth a
     caption is a picture carrying information. The credit stays inside the
     figcaption - moved out, it is a floating line belonging to nothing. -->
<figure class="article-figure">
  <img class="article-figure-image" src="slot:figure-image" alt="slot:figure-alt" width="1600" height="900" loading="lazy">
  <figcaption class="article-figure-caption"><!-- slot: caption --> <span class="article-figure-credit"><!-- slot: credit --></span></figcaption>
</figure>

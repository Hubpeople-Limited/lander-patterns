<!-- Card sizes: --feature or --even.
     Where the words sit: --below or --over. -->
<!-- One card per couple: duplicate the whole <li>. Three read best, and
     the large-and-small size is drawn for three. Each card works best with
     the couple's own photograph, the names they chose and where they are,
     shown with their OK. Delete the line when they gave no words of their
     own. section-id: draw it from the heading. -->
<section class="story-cards story-cards--feature story-cards--below" aria-labelledby="slot:section-id">
  <div class="story-cards-inner">
    <p class="story-cards-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="story-cards-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <ul class="story-cards-list" role="list" data-hub-module="reveal" data-hub-reveal-children>
      <li class="story-cards-item">
        <figure class="story-cards-figure">
          <div class="story-cards-frame">
            <img class="story-cards-img" src="slot:card-image" alt="slot:card-image-alt" width="960" height="1200" loading="lazy" decoding="async">
          </div>
          <figcaption class="story-cards-caption">
            <h3 class="story-cards-name"><!-- slot: card-name --></h3>
            <p class="story-cards-where"><!-- slot: card-where --></p>
            <p class="story-cards-line"><!-- slot: card-line --></p>
          </figcaption>
        </figure>
      </li>
    </ul>
  </div>
</section>

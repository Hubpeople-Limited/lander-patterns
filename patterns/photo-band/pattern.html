<!-- Take one height modifier: --short a strip | --standard | --tall most of a phone screen.
     Between two sections, never first and never last. Set width and height
     to the file's own pixel size so the page reserves the box before the
     image arrives. The alt says what is in the picture; where the band is
     decoration only, an empty alt is the right answer and a screen reader
     skips the band. -->
<div class="photo-band photo-band--standard">
  <img class="photo-band-image" src="slot:band-image" alt="slot:band-alt" width="1600" height="900" loading="lazy">
</div>

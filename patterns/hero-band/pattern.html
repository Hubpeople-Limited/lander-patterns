<!-- Take one photo rung and one ground: --end puts the photograph right,
     --start left, and --behind fills the band with it and sets the words
     on a panel of the ground: --plain, --soft, --brand or --deep.
     On a phone the photograph always comes first. Delete the eyebrow when
     nothing true fills it. Set width and height to the file's own pixels;
     never lazy-load it. -->
<section class="hero-band hero-band--end hero-band--plain">
  <div class="hero-band-inner">
    <div class="hero-band-copy">
      <p class="hero-band-eyebrow"><!-- slot: eyebrow --></p>
      <h1 class="hero-band-title"><!-- slot: headline --></h1>
      <p class="hero-band-sub"><!-- slot: subhead --></p>
      <div class="hero-band-cta">
        <a class="hero-band-btn" href="{{join.url}}">{{join.text}}</a>
      </div>
    </div>
    <div class="hero-band-visual">
      <img class="hero-band-img" src="slot:hero-image" alt="slot:hero-image-alt" width="1600" height="1000" fetchpriority="high" decoding="async">
    </div>
  </div>
</section>

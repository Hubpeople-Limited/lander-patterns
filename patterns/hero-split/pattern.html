tokens-used: --btn-radius, --card-radius, --card-shadow, --color-focus, --color-heading, --color-on-primary, --color-primary, --color-primary-dark, --color-surface, --color-text-soft, --container-max, --font-heading, --space-12, --space-3, --space-4, --space-6, --space-8, --type-scale, --heading-leading
variants: side=end|start

one-per-page: yes
status: active
added: 2026-08-21

<!-- Take one side modifier:
     --end puts the photograph on the end side, --start on the start side.
     Below 48rem the photograph comes first whichever side is chosen. -->
<section class="hero-split hero-split--end">
  <div class="hero-split-inner">
    <div class="hero-split-copy">
      <h1 class="hero-split-title"><!-- slot: headline --></h1>
      <p class="hero-split-sub"><!-- slot: subhead --></p>
      <!-- A SIGN-UP OPENER puts signup-card here in place of the anchor. -->
      <div class="hero-split-cta">
        <a class="hero-split-btn" href="{{join.url}}">{{join.text}}</a>
      </div>
    </div>
    <!-- The page's LCP element: never lazy, high fetch priority, and
         width/height set to the real file's intrinsic pixels. Fill srcset
         with a CDN ladder; sizes matches the column the photograph takes. -->
    <div class="hero-split-visual">
      <img src="slot:hero-image"
           srcset="slot:hero-image-srcset"
           sizes="(min-width: 78rem) 36rem, (min-width: 48rem) 50vw, 100vw"
           alt="slot:hero-image-alt"
           width="640"
           height="720"
           fetchpriority="high"
           decoding="async">
    </div>
  </div>
</section>

pairs-with: heading-block

<section class="testimonial-grid">
  <div class="testimonial-grid-inner">
    <h2 class="testimonial-grid-title"><!-- slot: section-title --></h2>
    <!-- Three testimonials reads best; the row locks to three columns from
         60rem. Every quote must be one the person actually wrote, with a real
         name and attribution. Delete the source link unless there is a real
         public page to point at. There is deliberately no star rating. -->
    <ul class="testimonial-grid-list" role="list">
      <!-- ONE <li> per testimonial; duplicate this whole block. To feature one
           of the set, add testimonial-grid-item--featured to its <li> and put a
           testimonial-grid-flag paragraph above its <blockquote>. At most one
           card carries either. -->
      <li class="testimonial-grid-item">
        <figure class="testimonial-grid-card">
          <img class="testimonial-grid-avatar" src="slot:avatar" alt="slot:avatar-alt" width="80" height="80" loading="lazy">
          <blockquote class="testimonial-grid-quote">
            <p><!-- slot: quote --></p>
          </blockquote>
          <figcaption class="testimonial-grid-person">
            <span class="testimonial-grid-name"><!-- slot: person-name --></span>
            <span class="testimonial-grid-role"><!-- slot: person-role --></span>
            <a class="testimonial-grid-source" href="slot:source-url"><!-- slot: source-text --></a>
          </figcaption>
        </figure>
      </li>
    </ul>
  </div>
</section>

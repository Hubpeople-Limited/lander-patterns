<!-- Take one ground modifier, optionally plus --centred. See the README.
       --plain page ground | --brand brand colour | --deep the scrim
     Delete the eyebrow when nothing true fills it; drop cta-assurance into
     the assurance slot. -->
<section class="hero-stated hero-stated--plain">
  <div class="hero-stated-inner">
    <p class="hero-stated-eyebrow"><!-- slot: eyebrow --></p>
    <h1 class="hero-stated-title"><!-- slot: headline --></h1>
    <p class="hero-stated-sub"><!-- slot: subhead --></p>
    <!-- A SIGN-UP OPENER puts signup-card here in place of the anchor, and
         the assurance slot stays empty: the card is the one control. -->
    <div class="hero-stated-cta">
      <a class="hero-stated-btn" href="{{join.url}}">{{join.text}}</a>
      <!-- slot: assurance -->
    </div>
  </div>
</section>

<!-- Take one ground modifier: --brand the brand colour | --deep the dark ground.
     The first element of the page body, above the site header. It scrolls
     away with the page, and a pinned header pins as it did. One line and
     one link: a second sentence makes it a section, and a section belongs
     on the page. -->
<aside class="announcement-bar announcement-bar--brand" aria-label="slot:bar-label">
  <p class="announcement-bar-inner">
    <span class="announcement-bar-text"><!-- slot: message --></span>
    <a class="announcement-bar-link" href="slot:link-url"><!-- slot: link-text --></a>
  </p>
</aside>

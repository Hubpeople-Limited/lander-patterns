<!--
name: stat-rows
display-name: Statistic rows
summary: Full-width rows, each a large figure with a line explaining it.
version: 9
type: section
page-types: homepage, landing
requires: none
content-shape: reference
description: Full-width editorial statistic rows - a large figure, a hairline that draws itself across, one supporting sentence set against it on the right.
keywords: stats, statistics, numbers, facts, figures, proof
needs: each real statistic exactly as the brand publishes it, one supporting sentence per figure from real material, and a short label naming what the strip is
pairs-with: heading-block
avoid-with: stats-band
tokens-used: --color-heading, --color-rule, --color-text-soft, --container-max, --font-heading, --space-2, --space-4, --space-5, --space-6, --space-8, --transition-slow, --type-scale, --heading-leading, --heading-tracking
motion: subtle
one-per-page: yes
status: active
added: 2026-08-21
behaviours: reveal
-->
<section class="stat-rows" aria-label="slot:strip-label">
  <dl class="stat-rows-list" data-hub-module="reveal" data-hub-reveal-children>
    <!-- One group per statistic; duplicate the whole div and increment
         --stat-rows-row-index. Three to five figures is the useful range.
         Every figure must be one the brand publishes. -->
    <div class="stat-rows-row" style="--stat-rows-row-index: 0">
      <dt class="stat-rows-figure"><!-- slot: stat-figure --></dt>
      <dd class="stat-rows-note"><!-- slot: stat-note --></dd>
    </div>
  </dl>
</section>

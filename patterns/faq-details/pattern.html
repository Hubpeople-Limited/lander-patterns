<section class="faq-details">
  <div class="faq-details-inner">
    <h2 class="faq-details-title"><!-- slot: section-title --></h2>
    <!-- One <details> per question. Duplicate the whole block below for each
         real question - the structure never changes between rows, only the
         question and its answer. Every row ships closed: see the README before
         adding an `open` attribute to the first one. The icon span is
         decorative and drawn in CSS; the open/closed state itself is carried
         by <details> and announced by the browser. -->
    <details class="faq-details-item">
      <summary class="faq-details-summary">
        <span class="faq-details-question"><!-- slot: question --></span>
        <span class="faq-details-icon" aria-hidden="true"></span>
      </summary>
      <div class="faq-details-answer">
        <!-- slot: answer -->
      </div>
    </details>
  </div>
</section>

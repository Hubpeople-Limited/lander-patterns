<!-- Shape: --portrait for tall cards, --round for circles.
     Ground: --plain, --soft, --brand or --deep. -->
<!-- One item per face: duplicate the whole <li>, eight to twelve of them.
     Each face is the person's own photograph, shown with their OK, and
     each face once. Delete the name line or the place line when the
     person gave none. Keep both behaviours on the rail on every rung: the
     still rung holds the gliding off, and a row that fits never glides.
     section-id: draw it from the heading. -->
<section class="portrait-row portrait-row--portrait portrait-row--plain" aria-labelledby="slot:section-id">
  <div class="portrait-row-inner">
    <p class="portrait-row-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="portrait-row-title" id="slot:section-id"><!-- slot: section-title --></h2>
  </div>
  <div class="portrait-row-rail" data-hub-module="marquee carousel" data-hub-carousel-prev-label="slot:previous-label" data-hub-carousel-next-label="slot:next-label" data-hub-marquee-pause-label="slot:pause-label">
    <ul class="portrait-row-list" role="list">
      <li class="portrait-row-item">
        <img class="portrait-row-img" src="slot:face-image" alt="slot:face-image-alt" width="480" height="640" loading="lazy" decoding="async">
        <p class="portrait-row-name"><!-- slot: face-name --></p>
        <p class="portrait-row-where"><!-- slot: face-where --></p>
      </li>
    </ul>
  </div>
</section>

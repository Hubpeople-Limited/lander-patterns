<!-- Layout: --centre or --start.
     Photographs: --with or --without.
     Background: --plain or --soft. -->
<!-- One moment per <li>, in date order: duplicate the whole <li>. Three to
     eight read best. Each moment is one the brand really had, with the date
     it happened: datetime takes it as 2016, 2016-05 or 2016-05-14, and the
     date shown is the year alone unless the brand asked for more. Delete
     the line when nothing true fills it, and the photograph when there is
     none: the moment closes up. section-id: draw it from the heading. -->
<section class="history-timeline history-timeline--centre history-timeline--with history-timeline--plain" aria-labelledby="slot:section-id">
  <div class="history-timeline-inner">
    <p class="history-timeline-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="history-timeline-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <ol class="history-timeline-list" role="list" data-hub-module="reveal" data-hub-reveal-children>
      <li class="history-timeline-item">
        <div class="history-timeline-body">
          <time class="history-timeline-num" datetime="slot:moment-datetime"><!-- slot: moment-when --></time>
          <h3 class="history-timeline-name"><!-- slot: moment-title --></h3>
          <p class="history-timeline-line"><!-- slot: moment-line --></p>
        </div>
        <img class="history-timeline-img" src="slot:moment-image" alt="slot:moment-image-alt" width="1200" height="900" loading="lazy" decoding="async">
      </li>
    </ol>
  </div>
</section>

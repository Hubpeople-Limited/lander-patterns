<fieldset class="currency-switch" data-hub-module="currency">
  <legend class="currency-switch-label"><!-- slot: switch-label --></legend>
  <!-- ONE <label> per currency the page shows, two to six; duplicate the
       whole <label>, in the order every price lists its currencies. Only the
       first keeps `checked`: it is the currency the page opens in. -->
  <label class="currency-switch-option">
    <input class="currency-switch-input" type="radio" name="currency-switch" value="slot:currency-code" checked>
    <span class="currency-switch-name"><!-- slot: currency-name --></span>
  </label>
</fieldset>
<!-- The switch acts on prices anywhere on the page, each written once for
     every currency in the same order as the options above:
     <span class="currency-switch-price"><span>first currency's price</span><span>second currency's price</span></span>
     Nothing else goes inside the wrapper, and a price outside one never changes. -->

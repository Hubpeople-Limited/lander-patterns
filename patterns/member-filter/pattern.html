<!-- One member-grid per panel, each scoped differently, each its own query.
     To drop the third, delete its input, its label AND its panel.

     ORDER IS STRUCTURAL: every radio is a direct child of the fieldset and
     sits before every panel. The switch reaches later siblings only.

     filter-name and the three filter-id-* must be unique on the page. -->
<fieldset class="member-filter">
  <legend class="member-filter-legend"><!-- slot: filter-legend --></legend>
  <input class="member-filter-radio member-filter-radio--one" type="radio" name="slot:filter-name" id="slot:filter-id-one" checked>
  <label class="member-filter-tab" for="slot:filter-id-one"><!-- slot: tab-one --></label>
  <input class="member-filter-radio member-filter-radio--two" type="radio" name="slot:filter-name" id="slot:filter-id-two">
  <label class="member-filter-tab" for="slot:filter-id-two"><!-- slot: tab-two --></label>
  <input class="member-filter-radio member-filter-radio--three" type="radio" name="slot:filter-name" id="slot:filter-id-three">
  <label class="member-filter-tab" for="slot:filter-id-three"><!-- slot: tab-three --></label>
  <div class="member-filter-panel member-filter-panel--one"><!-- slot: panel-one --></div>
  <div class="member-filter-panel member-filter-panel--two"><!-- slot: panel-two --></div>
  <div class="member-filter-panel member-filter-panel--three"><!-- slot: panel-three --></div>
</fieldset>

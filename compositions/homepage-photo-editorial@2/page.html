<!-- ================================================================
     homepage-photo-editorial@2 - generated by ci/compose.py from ci/page-recipes.json.
     Never hand-edit: change the pattern or the recipe and regenerate
     with `python ci/compose.py`.

     How to use this shell:
       1. Write real copy into every slot. A content slot is an HTML comment,
          `slot: name`; an attribute slot is a literal `slot:name` value.
       2. Duplicate whatever block a pattern's own comments say to duplicate,
          one per real item - never invent content to fill a block.
       3. Strip every comment, this one included, in the same pass. A
          finished page contains no comment and no `slot:` anywhere.
       4. Keep every {{ }} token exactly as it stands, head and body: the
          platform fills them per brand and per page.
       5. page.css beside this file is the page's whole stylesheet beyond
          the brand's tokens - load it after the brand's own stylesheet,
          or merge it into the brand stylesheet unchanged.
     ================================================================ -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{metaDescription}}">
<meta name="keywords" content="{{metaKeywords}}">
<link rel="canonical" href="{{canonicalPage}}">
<link rel="icon" href="{{favicon}}">
<link rel="stylesheet" href="page.css">
</head>
<body>
<!-- ================================================================
     section 1 of 6 : masthead-nav v5
     The site header the platform menu placeholder has no styling for
     - brand mark, the generated primary navigation and the login and
     join controls, on a choice of ground, two desktop arrangements,
     three small-screen behaviours, an optional pinned bar and two
     small-screen alignments.
     needs: the brand's logo, the menu items configured on the
     platform, and two words in the brand's own language - one for
     the small-screen menu button and one for that same button while
     the menu is showing. Every other value on it is platform
     furniture
     slots:
       home-url           attribute (href): a short label, about 1 word(s)
       menu-label         text, about 2 word(s). Sample: Menu (sample)
       close-label        text, about 2 word(s). Sample: Close (sample)
     ================================================================ -->

<!-- Login and join are INSIDE the disclosure and must stay there: an open
     drawer covers the bar, so a control left outside it cannot be reached for
     as long as the menu is showing. ci/lint.py fails the build if one moves.
     The data-hub-module attribute belongs to the drawer and is inert on the
     other two, because the behaviour acts only while the panel is fixed to
     the viewport, so it can be left in place or deleted either way.
     {{menu.navigation}} expands to a <ul class="canvas-navigation-menu"> the
     page cannot change. Leave it exactly as it is; pattern.css styles the
     classes it generates. Set the img width and height to the logo file's own
     pixel size - they set its aspect ratio, and --logo-height sets how tall it
     renders. -->
<header class="masthead-nav masthead-nav--plain masthead-nav--inline masthead-nav--drawer masthead-nav--static masthead-nav--menu-start">
  <div class="masthead-nav-inner">
    <a class="masthead-nav-mark" href="slot:home-url">
      <img class="masthead-nav-logo" src="{{logo.src}}" alt="{{logo.alt}}" width="240" height="60">
    </a>
    <details class="masthead-nav-disclosure" data-hub-module="drawer">
      <summary class="masthead-nav-toggle">
        <span class="masthead-nav-toggle-text"><!-- slot: menu-label --></span>
        <span class="masthead-nav-toggle-text masthead-nav-toggle-text--close"><!-- slot: close-label --></span>
        <span class="masthead-nav-toggle-icon" aria-hidden="true"></span>
      </summary>
      <div class="masthead-nav-tray">
        <nav class="masthead-nav-links" aria-label="Primary">
          {{menu.navigation}}
        </nav>
        <div class="masthead-nav-controls">
          <a class="masthead-nav-login" href="{{login.url}}">{{login.text}}</a>
          <a class="masthead-nav-join" href="{{join.url}}">{{join.text}}</a>
        </div>
      </div>
    </details>
  </div>
</header>

<!-- ================================================================
     section 2 of 6 : hero-centred v6
     Opener with the claim centred above a wide cropped photograph in
     its own band - the one hero that never lays a word over an
     image, so no scrim has to carry a ratio.
     needs: a headline of one or two lines and one supporting
     sentence, both from real brand material; one landscape
     photograph at least 1600px wide with its own alt text and a CDN
     srcset ladder
     slots:
       headline           text, about 4 word(s). Sample: Sample headline for preview
       subhead            text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
       hero-image         attribute (src): a path to real material, or a lib/placeholders/ stand-in while the brand's photography is still coming - said out loud, never silently
       hero-image-srcset  attribute (srcset): a short label, about 4 word(s)
       hero-image-alt     attribute (alt): what the image shows, in words
     ================================================================ -->

<section class="hero-centred">
  <div class="hero-centred-copy">
    <!-- The page's only h1. -->
    <h1 class="hero-centred-title"><!-- slot: headline --></h1>
    <p class="hero-centred-sub"><!-- slot: subhead --></p>
    <a class="hero-centred-btn" href="{{join.url}}">{{join.text}}</a>
  </div>
  <!-- No word is ever laid over this image, so it takes real alt text and
       needs no scrim. It is still the page's LCP element: never lazy, high
       fetch priority, and width/height carrying the real file's intrinsic
       pixel size so the box is reserved before a byte arrives. Fill srcset
       with a CDN ladder; sizes matches the band, which is capped at the
       container rather than full-bleed. -->
  <div class="hero-centred-media">
    <img class="hero-centred-img"
         src="slot:hero-image"
         srcset="slot:hero-image-srcset"
         sizes="(min-width: 78rem) 72rem, 100vw"
         alt="slot:hero-image-alt"
         width="1600"
         height="900"
         fetchpriority="high"
         decoding="async">
  </div>
</section>

<!-- ================================================================
     section 3 of 6 : zigzag-rows v9
     Alternating image-and-copy rows down the middle of a page - the
     image side swaps row to row through an explicit modifier class,
     and only the image ever moves.
     needs: one real photograph per row, at least 1000px on the short
     side, each with its own alt text; a short heading and one or two
     sentences per row; optionally one destination link per row
     slots:
       section-id         attribute (aria-labelledby/id): a page-unique id drawn from the heading
       section-title      text, about 3 word(s). Sample: Sample section title
       row-1-image        attribute (src): a path to real material, or a lib/placeholders/ stand-in while the brand's photography is still coming - said out loud, never silently
       row-1-image-alt    attribute (alt): what the image shows, in words
       row-1-heading      text, about 6 word(s). Sample: Sample heading for the first row
       row-1-body         text, about 14 word(s). Sample: One or two sentences of sample body copy, used only to ...
       row-1-link-url     attribute (href): a short label, about 1 word(s)
       row-1-link-text    text, about 3 word(s). Sample: Sample link text
       row-2-image        attribute (src): a path to real material, or a lib/placeholders/ stand-in while the brand's photography is still coming - said out loud, never silently
       row-2-image-alt    attribute (alt): what the image shows, in words
       row-2-heading      text, about 6 word(s). Sample: Sample heading for the mirrored row
       row-2-body         text, about 14 word(s). Sample: The second sample row, which mirrors the first so the p...
       row-2-link-url     attribute (href): a short label, about 1 word(s)
       row-2-link-text    text, about 3 word(s). Sample: Sample link text
     ================================================================ -->

<!-- section-id: draw it from the section's heading. -->
<section class="zigzag-rows" aria-labelledby="slot:section-id">
  <div class="zigzag-rows-inner" data-hub-module="reveal" data-hub-reveal-children>
    <!-- The section's own h2. Delete it only when heading-block sits directly
         above, and drop the aria-labelledby with it. -->
    <h2 class="zigzag-rows-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <!-- A PAIR OF ROWS, one plain and one mirrored. To add a third, copy either
         row, rename its placeholders to row-3-*, and keep alternating so every
         second row carries zigzag-rows-row--mirrored. Three to five rows is the
         useful range.

         Only the media ever moves, and the alternation is stated on the row -
         never inferred with :nth-child - so inserting anything between rows
         cannot invert every row below it.

         Never wrap a row's image in a link: in a mirrored row that puts a focus
         stop in the half that moves. The row's destination belongs in the copy
         link. -->
    <div class="zigzag-rows-row">
      <div class="zigzag-rows-media">
        <img class="zigzag-rows-img" loading="lazy" src="slot:row-1-image" alt="slot:row-1-image-alt" width="800" height="800">
      </div>
      <div class="zigzag-rows-copy">
        <h3 class="zigzag-rows-heading"><!-- slot: row-1-heading --></h3>
        <p class="zigzag-rows-body"><!-- slot: row-1-body --></p>
        <p class="zigzag-rows-action">
          <a class="zigzag-rows-link" href="slot:row-1-link-url"><!-- slot: row-1-link-text --></a>
        </p>
      </div>
    </div>
    <div class="zigzag-rows-row zigzag-rows-row--mirrored">
      <div class="zigzag-rows-media">
        <img class="zigzag-rows-img" loading="lazy" src="slot:row-2-image" alt="slot:row-2-image-alt" width="800" height="800">
      </div>
      <div class="zigzag-rows-copy">
        <h3 class="zigzag-rows-heading"><!-- slot: row-2-heading --></h3>
        <p class="zigzag-rows-body"><!-- slot: row-2-body --></p>
        <p class="zigzag-rows-action">
          <a class="zigzag-rows-link" href="slot:row-2-link-url"><!-- slot: row-2-link-text --></a>
        </p>
      </div>
    </div>
  </div>
</section>

<!-- ================================================================
     section 4 of 6 : faq-details v6
     Zero-JavaScript FAQ accordion on native details/summary -
     hairline rows, a plus that turns into a cross when the row
     opens.
     needs: the real questions people actually ask, each with a true
     answer in the brand's own words; a section heading
     slots:
       section-title      text, about 3 word(s). Sample: Sample questions heading
       question           text, about 11 word(s). Sample: A sample question, phrased the way a visitor would ask it?
       answer             markup, about 22 words of copy; shape it like this sample:
                          <p>Sample answer paragraph, used only to render this
                          preview.</p><p>A second sample paragraph, to show how the
                          preview handles more than one.</p>
     ================================================================ -->

<section class="faq-details">
  <div class="faq-details-inner">
    <h2 class="faq-details-title"><!-- slot: section-title --></h2>
    <!-- One <details> per question. Duplicate the whole block below for each
         real question - the structure never changes between rows, only the
         question and its answer. Every row ships closed: see patterns/faq-details/README.md before
         adding an `open` attribute to the first one. The icon span is
         decorative and drawn in CSS; the open/closed state itself is carried
         by <details> and announced by the browser. -->
    <details class="faq-details-item">
      <summary class="faq-details-summary">
        <span class="faq-details-question"><!-- slot: question --></span>
        <span class="faq-details-icon" aria-hidden="true"></span>
      </summary>
      <div class="faq-details-answer">
        <!-- slot: answer -->
      </div>
    </details>
  </div>
</section>

<!-- ================================================================
     section 5 of 6 : cta-image v4
     Full-bleed photographic closing call to action - one landscape
     image, a scrim carrying the contrast, and a centred claim with
     both platform controls over it.
     needs: one landscape photograph strong enough to fill a band at
     least 2000px wide, with its own alt text and a CDN srcset
     ladder; a closing headline and one supporting line of real copy
     slots:
       cta-image-id       attribute (aria-labelledby/id): a page-unique id drawn from the heading
       background-image   attribute (src): a path to real material, or a lib/placeholders/ stand-in while the brand's photography is still coming - said out loud, never silently
       background-image-srcset attribute (srcset): a short label, about 4 word(s)
       background-image-alt attribute (alt): what the image shows, in words
       eyebrow            text, about 2 word(s). Sample: Sample eyebrow
       title              text, about 5 word(s). Sample: Sample closing headline for preview
       lead               text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
     ================================================================ -->

<!-- Place as the page's last content block, before the footer.

     The image is decoration under a scrim, but it is the section's whole
     atmosphere, so it takes real alt text unless it is a pure texture - then
     empty the value, never delete the attribute. Fill srcset with a CDN
     ladder; sizes is 100vw because the band is genuinely full-bleed.
     loading is lazy on purpose: this sits at the foot of a long page, so it
     is never the LCP element. -->
<section class="cta-image" aria-labelledby="slot:cta-image-id">
  <img class="cta-image-img"
       src="slot:background-image"
       srcset="slot:background-image-srcset"
       sizes="100vw"
       alt="slot:background-image-alt"
       width="2000"
       height="1125"
       loading="lazy"
       decoding="async">
  <div class="cta-image-inner">
    <p class="cta-image-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="cta-image-title" id="slot:cta-image-id"><!-- slot: title --></h2>
    <p class="cta-image-lead"><!-- slot: lead --></p>
    <!-- Two platform controls, no invented destinations. Delete the second
         anchor for a pure acquisition page; never repoint it by hand. -->
    <div class="cta-image-actions">
      <a class="cta-image-btn" href="{{join.url}}">{{join.text}}</a>
      <a class="cta-image-ghost" href="{{login.url}}">{{login.text}}</a>
    </div>
  </div>
</section>

<!-- ================================================================
     section 6 of 6 : colophon v1
     The site footer a page carries itself - the brand's footer menu,
     the four legal links and a copyright line, set small on a quiet
     ground; the platform fills every link, the page owns the markup.
     needs: the brand's name for the copyright line. Every link on it
     is platform furniture
     slots:
       copyright          text, about 7 word(s). Sample: © 2026 Sample Brand. All rights reserved.
     ================================================================ -->

<!-- Place as the last element of the page body: nothing sits below it.
     The legal links and the footer menu are platform furniture; keep each
     placeholder exactly as found, never a literal URL in its place.
     {{menu.footer}} expands to the brand's managed footer menu, and on a
     brand that manages none it expands to nothing - delete the whole nav
     element then, rather than shipping an empty landmark. -->
<footer class="colophon colophon--plain">
  <div class="colophon-inner">
    <nav class="colophon-menu" aria-label="Footer">
      {{menu.footer}}
    </nav>
    <ul class="colophon-legal" role="list">
      <li><a href="{{footerLinks.privacyPolicyUrl}}">Privacy Policy</a></li>
      <li><a href="{{footerLinks.termsAndConditionsUrl}}">Terms &amp; Conditions</a></li>
      <li><a href="{{footerLinks.cookiesUrl}}">Cookie Policy</a></li>
      <li><a href="{{footerLinks.antiSlaveryPolicyUrl}}">Anti-Slavery Policy</a></li>
    </ul>
    <p class="colophon-copyright"><!-- slot: copyright --></p>
  </div>
</footer>
</body>
</html>

<!-- ================================================================
     features@1 - generated by ci/compose.py from ci/page-recipes.json.
     Never hand-edit: change the pattern or the recipe and regenerate
     with `python ci/compose.py`.

     How to use this shell:
       1. Write real copy into every slot. A content slot is an HTML comment,
          `slot: name`; an attribute slot is a literal `slot:name` value.
       2. Duplicate whatever block a pattern's own comments say to duplicate,
          one per real item - never invent content to fill a block.
       3. Strip every comment, this one included, in the same pass. A
          finished page contains no comment and no `slot:` anywhere.
       4. Keep every {{ }} token exactly as it stands, head and body: the
          platform fills them per brand and per page.
       5. page.css beside this file is the page's whole stylesheet beyond
          the brand's tokens - load it after the brand's own stylesheet,
          or merge it into the brand stylesheet unchanged.
     ================================================================ -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{metaDescription}}">
<meta name="keywords" content="{{metaKeywords}}">
<link rel="canonical" href="{{canonicalPage}}">
<link rel="icon" href="{{favicon}}">
<link rel="stylesheet" href="page.css">
</head>
<body>
<!-- ================================================================
     section 1 of 7 : masthead-nav v10
     The site header the platform menu placeholder has no styling for
     - brand mark, the generated primary navigation and the login and
     join controls, on a choice of ground, two desktop arrangements,
     three small-screen behaviours, three answers for a menu too long
     for its row, a dropdown or a full-width panel for submenus, a
     bar that stays and shrinks as the page scrolls, a menu-free rung
     for a campaign page, three ways the mark meets its ground, a
     menu button with or without its word, and three bottom edges.
     needs: the brand's logo, the menu items configured on the
     platform, and three words in the brand's own language - one for
     the small-screen menu button, one for that same button while the
     menu is showing, and one for the item that holds whatever does
     not fit the row. Every other value on it is platform furniture
     slots:
       home-url           attribute (href): a short label, about 1 word(s)
       menu-label         text, about 2 word(s). Sample: Menu (sample)
       close-label        text, about 2 word(s). Sample: Close (sample)
       more-label         attribute (data-hub-overflow-label): a short label, about 2 word(s)
     ================================================================ -->

<!-- Login and join are INSIDE the disclosure and must stay there: an open
     drawer covers the bar. ci/lint.py fails the build if one moves.
     Every data-hub-module attribute is inert without the behaviour library.
     {{menu.navigation}} expands to a list the page cannot change; pattern.css
     styles whatever list sits inside the nav landmark, so a list written by
     hand in the same shape takes the same styling. Set the img width and
     height to the logo file's own pixel size; --logo-height sets how tall it renders. -->
<header class="masthead-nav masthead-nav--plain masthead-nav--inline masthead-nav--drawer masthead-nav--more masthead-nav--dropdown masthead-nav--full masthead-nav--static masthead-nav--direct masthead-nav--menu-start masthead-nav--side-end masthead-nav--labelled masthead-nav--rule" data-hub-module="shrink">
  <div class="masthead-nav-inner">
    <a class="masthead-nav-mark" href="slot:home-url">
      <img class="masthead-nav-logo" src="{{logo.src}}" alt="{{logo.alt}}" width="240" height="60">
    </a>
    <details class="masthead-nav-disclosure" data-hub-module="drawer">
      <summary class="masthead-nav-toggle">
        <span class="masthead-nav-toggle-text"><!-- slot: menu-label --></span>
        <span class="masthead-nav-toggle-text masthead-nav-toggle-text--close"><!-- slot: close-label --></span>
        <span class="masthead-nav-toggle-icon" aria-hidden="true"></span>
      </summary>
      <div class="masthead-nav-tray">
        <nav class="masthead-nav-links" aria-label="Primary" data-hub-module="overflow menu" data-hub-overflow-label="slot:more-label">
          {{menu.navigation}}
        </nav>
        <div class="masthead-nav-controls">
          <a class="masthead-nav-login" href="{{login.url}}">{{login.text}}</a>
          <a class="masthead-nav-join" href="{{join.url}}">{{join.text}}</a>
        </div>
      </div>
    </details>
  </div>
</header>

<!-- ================================================================
     section 2 of 7 : hero-stated v4
     variant: ground=plain
     An opener made of words - a display claim, one supporting line
     and the join control - on a choice of three grounds and two
     alignments, with no photograph anywhere in it.
     needs: a headline the brand can stand behind and one supporting
     sentence that says something the headline does not. Nothing else
     - no photograph, no figure, no logo. This is the opener for a
     brand that has words and nothing else yet
     slots:
       eyebrow            text, about 2 word(s). Sample: Sample eyebrow
       headline           text, about 7 word(s). Sample: A sample headline for preview, set large
       subhead            text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
       assurance          markup, about 4 words of copy; uses cta-assurance, whose CSS is in page.css; shape it like this sample:
                          <ul class="cta-assurance" role="list"><li
                          class="cta-assurance-item">Sample assurance</li><li
                          class="cta-assurance-item">Sample assurance</li></ul>
     ================================================================ -->

<!-- Delete the eyebrow when nothing true fills it; drop cta-assurance into
     the assurance slot. -->
<section class="hero-stated hero-stated--plain">
  <div class="hero-stated-inner">
    <p class="hero-stated-eyebrow"><!-- slot: eyebrow --></p>
    <h1 class="hero-stated-title"><!-- slot: headline --></h1>
    <p class="hero-stated-sub"><!-- slot: subhead --></p>
    <div class="hero-stated-cta">
      <a class="hero-stated-btn" href="{{join.url}}">{{join.text}}</a>
      <!-- slot: assurance -->
    </div>
  </div>
</section>

<!-- ================================================================
     section 3 of 7 : feature-panels v5
     A run of full-bleed panels climbing a ground ladder - light,
     then the brand colour, then dark - each carrying a mark, a
     label, one large claim and a link on its floor.
     needs: two to four real things the brand offers that genuinely
     sit in an order - tiers, levels, degrees of visibility. Three
     panels ship and there are exactly three grounds: for two, delete
     the middle panel; for four, repeat the middle ground rather than
     inventing a fourth. Each needs a short label, one claim of a few
     words, and a simple line mark drawn inline. A section heading,
     and a supporting line only where there is something true to say
     slots:
       section-id         attribute (aria-labelledby/id): a page-unique id drawn from the heading
       eyebrow            text, about 2 word(s). Sample: Sample eyebrow
       section-title      text, about 3 word(s). Sample: Sample panels heading
       section-intro      text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
       panel-1-label      text, about 2 word(s). Sample: Sample one
       panel-1-claim      text, about 6 word(s). Sample: Sample claim for the first panel
       panel-1-link-text  text, about 2 word(s). Sample: Sample link
       panel-2-label      text, about 2 word(s). Sample: Sample two
       panel-2-claim      text, about 6 word(s). Sample: Sample claim for the second panel
       panel-2-link-text  text, about 2 word(s). Sample: Sample link
       panel-3-label      text, about 2 word(s). Sample: Sample three
       panel-3-claim      text, about 6 word(s). Sample: Sample claim for the third panel
       panel-3-link-text  text, about 2 word(s). Sample: Sample link
     ================================================================ -->

<!-- section-id: draw it from the heading.

     THREE PANELS SHIP, AND THEIR ORDER IS THE POINT. Each carries one ground
     modifier and they run light, brand, deep - the climb is what says these
     things are ranked. Never reorder them and never give two panels the same
     modifier. The three grounds are the only ones that exist:
       feature-panels-item--light  on --color-surface-soft
       feature-panels-item--brand  on --color-primary
       feature-panels-item--deep   on --color-scrim
     For two panels, delete the middle one. For four, repeat --brand only
     where the brand genuinely has two middle tiers; a fourth ground does not
     exist and must not be invented.

     Replace each mark's path data with the real one. Keep
     stroke="currentColor" and add no fill, so a mark takes whatever ink its
     panel carries. -->
<section class="feature-panels" aria-labelledby="slot:section-id">
  <div class="feature-panels-head">
    <p class="feature-panels-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="feature-panels-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <p class="feature-panels-intro"><!-- slot: section-intro --></p>
  </div>
  <ul class="feature-panels-list" role="list">
    <li class="feature-panels-item feature-panels-item--light">
      <p class="feature-panels-mark">
        <span class="feature-panels-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <circle cx="12" cy="12" r="8"></circle>
          </svg>
        </span>
        <!-- slot: panel-1-label -->
      </p>
      <h3 class="feature-panels-claim"><!-- slot: panel-1-claim --></h3>
      <p class="feature-panels-action">
        <a class="feature-panels-link" href="{{join.url}}">
          <!-- slot: panel-1-link-text -->
          <span class="feature-panels-arrow" aria-hidden="true">&#8594;</span>
        </a>
      </p>
    </li>
    <li class="feature-panels-item feature-panels-item--brand">
      <p class="feature-panels-mark">
        <span class="feature-panels-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 8v8"></path>
          </svg>
        </span>
        <!-- slot: panel-2-label -->
      </p>
      <h3 class="feature-panels-claim"><!-- slot: panel-2-claim --></h3>
      <p class="feature-panels-action">
        <a class="feature-panels-link" href="{{join.url}}">
          <!-- slot: panel-2-link-text -->
          <span class="feature-panels-arrow" aria-hidden="true">&#8594;</span>
        </a>
      </p>
    </li>
    <li class="feature-panels-item feature-panels-item--deep">
      <p class="feature-panels-mark">
        <span class="feature-panels-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M8 12h8"></path>
            <path d="M12 8v8"></path>
          </svg>
        </span>
        <!-- slot: panel-3-label -->
      </p>
      <h3 class="feature-panels-claim"><!-- slot: panel-3-claim --></h3>
      <p class="feature-panels-action">
        <a class="feature-panels-link" href="{{join.url}}">
          <!-- slot: panel-3-link-text -->
          <span class="feature-panels-arrow" aria-hidden="true">&#8594;</span>
        </a>
      </p>
    </li>
  </ul>
</section>

<!-- ================================================================
     section 4 of 7 : comparison-table v4
     A real table comparing three things against the same criteria -
     tier names across the top, one criterion per row, the
     recommended column named in words and never by colour alone.
     needs: two or three real things the brand offers that are
     genuinely comparable against the same criteria, and the criteria
     themselves - one per row, in the brand's own words. Each cell
     says what that thing actually gives, not a tick borrowed from a
     competitor. A recommended column only where the brand recommends
     one
     slots:
       section-id         attribute (aria-labelledby/id): a page-unique id drawn from the heading
       section-title      text, about 3 word(s). Sample: Sample comparison heading
       section-intro      text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
       table-label        attribute (aria-label): a short label, about 4 word(s)
       table-caption      text, about 7 word(s). Sample: A sample caption for the preview render.
       tier-a             text, about 2 word(s). Sample: Sample A
       tier-b             text, about 2 word(s). Sample: Sample B
       tier-b-flag        text, about 2 word(s). Sample: Sample flag
       tier-c             text, about 2 word(s). Sample: Sample C
       criterion          text, about 2 word(s). Sample: Sample criterion
       cell-a             text, about 2 word(s). Sample: Sample value
       cell-b             text, about 4 word(s). Sample: Sample value, preview only
       cell-c             text, about 2 word(s). Sample: Sample value
     ================================================================ -->

<!-- THREE COLUMNS SHIP. For two, delete the -c cell from the head row and
     from every body row. For four, duplicate the -c cell in both places and
     name the new slots. Head and body must always carry the same count.

     Duplicate the whole comparison-table-row for each criterion.

     The recommended flag: where the brand recommends nothing, delete the
     whole comparison-table-flag span and the --recommended class beside it.
     Never keep the tint without the word. -->
<section class="comparison-table" aria-labelledby="slot:section-id">
  <div class="comparison-table-inner">
    <h2 class="comparison-table-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <p class="comparison-table-intro"><!-- slot: section-intro --></p>
    <div class="comparison-table-scroll" tabindex="0" role="region" aria-label="slot:table-label">
      <table class="comparison-table-grid">
        <caption class="comparison-table-caption"><!-- slot: table-caption --></caption>
        <thead>
          <tr>
            <td class="comparison-table-corner"></td>
            <th scope="col" class="comparison-table-head">
              <span class="comparison-table-name"><!-- slot: tier-a --></span>
            </th>
            <th scope="col" class="comparison-table-head comparison-table-head--recommended">
              <span class="comparison-table-name"><!-- slot: tier-b --></span>
              <span class="comparison-table-flag"><!-- slot: tier-b-flag --></span>
            </th>
            <th scope="col" class="comparison-table-head">
              <span class="comparison-table-name"><!-- slot: tier-c --></span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr class="comparison-table-row">
            <th scope="row" class="comparison-table-criterion"><!-- slot: criterion --></th>
            <td class="comparison-table-cell"><!-- slot: cell-a --></td>
            <td class="comparison-table-cell comparison-table-cell--recommended"><!-- slot: cell-b --></td>
            <td class="comparison-table-cell"><!-- slot: cell-c --></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- ================================================================
     section 5 of 7 : faq-details v6
     Zero-JavaScript FAQ accordion on native details/summary -
     hairline rows, a plus that turns into a cross when the row
     opens.
     needs: the real questions people actually ask, each with a true
     answer in the brand's own words; a section heading
     slots:
       section-title      text, about 3 word(s). Sample: Sample questions heading
       question           text, about 11 word(s). Sample: A sample question, phrased the way a visitor would ask it?
       answer             markup, about 22 words of copy; shape it like this sample:
                          <p>Sample answer paragraph, used only to render this
                          preview.</p><p>A second sample paragraph, to show how the
                          preview handles more than one.</p>
     ================================================================ -->

<section class="faq-details">
  <div class="faq-details-inner">
    <h2 class="faq-details-title"><!-- slot: section-title --></h2>
    <!-- One <details> per question. Duplicate the whole block below for each
         real question - the structure never changes between rows, only the
         question and its answer. Every row ships closed: see patterns/faq-details/README.md before
         adding an `open` attribute to the first one. The icon span is
         decorative and drawn in CSS; the open/closed state itself is carried
         by <details> and announced by the browser. -->
    <details class="faq-details-item">
      <summary class="faq-details-summary">
        <span class="faq-details-question"><!-- slot: question --></span>
        <span class="faq-details-icon" aria-hidden="true"></span>
      </summary>
      <div class="faq-details-answer">
        <!-- slot: answer -->
      </div>
    </details>
  </div>
</section>

<!-- ================================================================
     section 6 of 7 : cta-band v5
     Plain full-bleed closing call to action on a choice of four
     grounds - a centred claim, one supporting line and one control;
     the ordinary page finale, and the section most pages on a brand
     have in common.
     needs: a closing headline and one supporting line of real copy,
     both saying something the page has earned the right to say
     slots:
       cta-band-id        attribute (aria-labelledby/id): a page-unique id drawn from the heading
       eyebrow            text, about 2 word(s). Sample: Sample eyebrow
       title              text, about 5 word(s). Sample: Sample closing headline for preview
       lead               text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
     ================================================================ -->

<!-- Place as the page's last content block, before the footer. Delete the
     eyebrow when there is nothing true to put in it. -->
<section class="cta-band cta-band--brand" aria-labelledby="slot:cta-band-id">
  <div class="cta-band-inner">
    <p class="cta-band-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="cta-band-title" id="slot:cta-band-id"><!-- slot: title --></h2>
    <p class="cta-band-lead"><!-- slot: lead --></p>
    <a class="cta-band-btn" href="{{join.url}}">{{join.text}}</a>
  </div>
</section>

<!-- ================================================================
     section 7 of 7 : colophon v2
     The site footer a page carries itself - the brand's footer menu,
     the four legal links and a copyright line, set small on a quiet
     ground, centred on one line or laid out in columns, with the
     brand mark above them or not; the platform fills every link, the
     page owns the markup.
     needs: the brand's name for the copyright line, and where the
     mark links to when it is shown. Every link on it is platform
     furniture
     slots:
       home-url           attribute (href): a short label, about 1 word(s)
       copyright          text, about 7 word(s). Sample: © 2026 Sample Brand. All rights reserved.
     ================================================================ -->

<!-- Place as the last element of the page body: nothing sits below it.
     The legal links and the footer menu are platform furniture; keep each
     placeholder exactly as found, never a literal URL in its place.
     {{menu.footer}} expands to the brand's managed footer menu, and on a
     brand that manages none it expands to nothing - delete the whole nav
     element then, rather than shipping an empty landmark.
     A page built without the mark may delete the whole colophon-mark element
     rather than leave a hidden image in place. Set the img width and height
     to the logo file's own pixel size; the rendered height follows the
     brand's logo height token. -->
<footer class="colophon colophon--plain colophon--line colophon--none">
  <div class="colophon-inner">
    <a class="colophon-mark" href="slot:home-url">
      <img class="colophon-logo" src="{{logo.src}}" alt="{{logo.alt}}" width="240" height="60">
    </a>
    <nav class="colophon-menu" aria-label="Footer">
      {{menu.footer}}
    </nav>
    <ul class="colophon-legal" role="list">
      <li><a href="{{footerLinks.privacyPolicyUrl}}">Privacy Policy</a></li>
      <li><a href="{{footerLinks.termsAndConditionsUrl}}">Terms &amp; Conditions</a></li>
      <li><a href="{{footerLinks.cookiesUrl}}">Cookie Policy</a></li>
      <li><a href="{{footerLinks.antiSlaveryPolicyUrl}}">Anti-Slavery Policy</a></li>
    </ul>
    <p class="colophon-copyright"><!-- slot: copyright --></p>
  </div>
</footer>
</body>
</html>

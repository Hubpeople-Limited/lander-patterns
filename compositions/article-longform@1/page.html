<!-- ================================================================
     article-longform@1 - generated by ci/compose.py from ci/page-recipes.json.
     Never hand-edit: change the pattern or the recipe and regenerate
     with `python ci/compose.py`.

     How to use this shell:
       1. Write real copy into every slot. A content slot is an HTML comment,
          `slot: name`; an attribute slot is a literal `slot:name` value.
       2. Duplicate whatever block a pattern's own comments say to duplicate,
          one per real item - never invent content to fill a block.
       3. Strip every comment, this one included, in the same pass. A
          finished page contains no comment and no `slot:` anywhere.
       4. Keep every {{ }} token exactly as it stands, head and body: the
          platform fills them per brand and per page.
       5. page.css beside this file is the page's whole stylesheet beyond
          the brand's tokens - load it after the brand's own stylesheet,
          or merge it into the brand stylesheet unchanged.
     ================================================================ -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{metaDescription}}">
<meta name="keywords" content="{{metaKeywords}}">
<link rel="canonical" href="{{canonicalPage}}">
<link rel="icon" href="{{favicon}}">
<link rel="stylesheet" href="page.css">
</head>
<body>
<!-- ================================================================
     section 1 of 9 : masthead-nav v10
     The site header the platform menu placeholder has no styling for
     - brand mark, the generated primary navigation and the login and
     join controls, on a choice of ground, two desktop arrangements,
     three small-screen behaviours, three answers for a menu too long
     for its row, a dropdown or a full-width panel for submenus, a
     bar that stays and shrinks as the page scrolls, a menu-free rung
     for a campaign page, three ways the mark meets its ground, a
     menu button with or without its word, and three bottom edges.
     needs: the brand's logo, the menu items configured on the
     platform, and three words in the brand's own language - one for
     the small-screen menu button, one for that same button while the
     menu is showing, and one for the item that holds whatever does
     not fit the row. Every other value on it is platform furniture
     slots:
       home-url           attribute (href): a short label, about 1 word(s)
       menu-label         text, about 2 word(s). Sample: Menu (sample)
       close-label        text, about 2 word(s). Sample: Close (sample)
       more-label         attribute (data-hub-overflow-label): a short label, about 2 word(s)
     ================================================================ -->

<!-- Login and join are INSIDE the disclosure and must stay there: an open
     drawer covers the bar. ci/lint.py fails the build if one moves.
     Every data-hub-module attribute is inert without the behaviour library.
     {{menu.navigation}} expands to a list the page cannot change; pattern.css
     styles whatever list sits inside the nav landmark, so a list written by
     hand in the same shape takes the same styling. Set the img width and
     height to the logo file's own pixel size; --logo-height sets how tall it renders. -->
<header class="masthead-nav masthead-nav--plain masthead-nav--inline masthead-nav--drawer masthead-nav--more masthead-nav--dropdown masthead-nav--full masthead-nav--static masthead-nav--direct masthead-nav--menu-start masthead-nav--side-end masthead-nav--labelled masthead-nav--rule" data-hub-module="shrink">
  <div class="masthead-nav-inner">
    <a class="masthead-nav-mark" href="slot:home-url">
      <img class="masthead-nav-logo" src="{{logo.src}}" alt="{{logo.alt}}" width="240" height="60">
    </a>
    <details class="masthead-nav-disclosure" data-hub-module="drawer">
      <summary class="masthead-nav-toggle">
        <span class="masthead-nav-toggle-text"><!-- slot: menu-label --></span>
        <span class="masthead-nav-toggle-text masthead-nav-toggle-text--close"><!-- slot: close-label --></span>
        <span class="masthead-nav-toggle-icon" aria-hidden="true"></span>
      </summary>
      <div class="masthead-nav-tray">
        <nav class="masthead-nav-links" aria-label="Primary" data-hub-module="overflow menu" data-hub-overflow-label="slot:more-label">
          {{menu.navigation}}
        </nav>
        <div class="masthead-nav-controls">
          <a class="masthead-nav-login" href="{{login.url}}">{{login.text}}</a>
          <a class="masthead-nav-join" href="{{join.url}}">{{join.text}}</a>
        </div>
      </div>
    </details>
  </div>
</header>

<!-- ================================================================
     section 2 of 9 : article-masthead v9
     Bylined article header - metadata eyebrow over a hairline,
     display h1, a lede held to a short measure, and an author row
     under a second hairline.
     needs: a real article title and a real lede of one or two
     sentences; the category the piece genuinely sits in; an honest
     read time and a genuine publication date; the name and role of
     the person who actually wrote it, with their real portrait and
     real alt text
     slots:
       tag                text, about 2 word(s). Sample: Sample category
       read-time          text, about 4 word(s). Sample: 6 min sample read
       publish-datetime   attribute (datetime): a short label, about 1 word(s)
       publish-date       text, about 4 word(s). Sample: 1 January 2026 (sample)
       title              text, about 8 word(s). Sample: A sample article title for the preview render
       lede               text, about 19 word(s). Sample: One or two sentences of sample standfirst, written only...
       author-portrait    attribute (src): a path to real material, or a lib/placeholders/ stand-in while the brand's photography is still coming - said out loud, never silently
       author-portrait-alt attribute (alt): what the image shows, in words
       author-name        text, about 2 word(s). Sample: Sample Author
       author-role        text, about 6 word(s). Sample: Sample role line for the preview
     ================================================================ -->

<!-- All three eyebrow items are required; the separators between them are
     decorative and go with whatever item they precede. datetime takes the
     machine-readable date (2026-08-22), the slot beside it the words a reader
     sees. This block carries the page's only h1. -->
<div class="article-masthead">
  <div class="article-masthead-meta">
    <p class="article-masthead-item article-masthead-tag"><!-- slot: tag --></p>
    <span class="article-masthead-sep" aria-hidden="true">&middot;</span>
    <p class="article-masthead-item"><!-- slot: read-time --></p>
    <span class="article-masthead-sep" aria-hidden="true">&middot;</span>
    <time class="article-masthead-item" datetime="slot:publish-datetime"><!-- slot: publish-date --></time>
  </div>
  <h1 class="article-masthead-title"><!-- slot: title --></h1>
  <p class="article-masthead-lede"><!-- slot: lede --></p>
  <div class="article-masthead-author">
    <img class="article-masthead-avatar" src="slot:author-portrait" alt="slot:author-portrait-alt" width="88" height="88" loading="lazy">
    <div class="article-masthead-author-meta">
      <p class="article-masthead-byline"><!-- slot: author-name --></p>
      <p class="article-masthead-role"><!-- slot: author-role --></p>
    </div>
  </div>
</div>

<!-- ================================================================
     section 3 of 9 : article-toc v1
     In-page contents for a long piece - a short list of anchor links
     to the sections below, inside a native disclosure so a reader
     can put it away. No script anywhere.
     needs: the article's own section headings, in the order they
     appear, and an id written onto each of those headings in the
     body. The words in the list are the headings themselves, never a
     second set of titles written for the list
     slots:
       contents-label     text, about 2 word(s). Sample: Sample contents
       section-anchor     attribute (href): a short label, about 1 word(s)
       section-title      text, about 11 word(s). Sample: A sample section heading, as it is worded in the body
     ================================================================ -->

<!-- WRITE THE IDS FIRST. Every href here is a hash plus the id of the heading
     it points at, and those ids do not exist until somebody puts them on the
     headings in the article body:

       h2 id="how-we-check"   ->   href="#how-we-check"

     A contents list pointing at ids nobody added is a page of dead links, and
     nothing on the page says so - the browser stays where it is.

     ONE entry. Duplicate the whole li for each section, in the order the
     sections appear, and use the heading's own words. The list ships open;
     delete `open` to have it arrive collapsed. -->
<nav class="article-toc" aria-labelledby="article-toc-label">
  <details class="article-toc-disclosure" open>
    <summary class="article-toc-summary">
      <span class="article-toc-label" id="article-toc-label"><!-- slot: contents-label --></span>
      <span class="article-toc-icon" aria-hidden="true"></span>
    </summary>
    <ol class="article-toc-list" role="list">
      <li class="article-toc-item">
        <a class="article-toc-link" href="slot:section-anchor"><!-- slot: section-title --></a>
      </li>
    </ol>
  </details>
</nav>

<!-- ================================================================
     section 4 of 9 : prose-column v5
     The body of a piece of writing - one column held to a readable
     measure, with the headings, paragraphs, lists and quotes an
     article actually uses already set.
     needs: real writing. Headings that say what their section
     contains, each section opening with a complete one-sentence
     answer to the question its heading raises
     slots:
       opening-paragraph  text, about 22 word(s). Sample: A sample opening paragraph, used only to render this pr...
       section-heading    text, about 3 word(s). Sample: Sample section heading
       section-opening-sentence-then-the-rest text, about 24 word(s). Sample: A sample section opening with a complete first sentence...
       list-item          text, about 3 word(s). Sample: Sample list item
       quote              text, about 10 word(s). Sample: A sample pull quote, here only to render this preview.
       quote-attribution  text, about 2 word(s). Sample: Sample attribution
       table-label        attribute (aria-label): a short label, about 5 word(s)
       table-caption      text, about 3 word(s). Sample: Sample table caption
       column-heading     text, about 2 word(s). Sample: Sample column
       column-heading-2   text, about 3 word(s). Sample: Sample column two
       row-heading        text, about 2 word(s). Sample: Sample row
       cell               text, about 2 word(s). Sample: Sample cell
     ================================================================ -->

<!-- A worked skeleton, not a fixed structure: keep the elements the writing
     uses and delete the rest. Nothing here takes a class - the column styles
     its own descendants. Headings start at h2; do not skip a level. -->
<div class="prose-column">
  <p><!-- slot: opening-paragraph --></p>

  <h2><!-- slot: section-heading --></h2>
  <p><!-- slot: section-opening-sentence-then-the-rest --></p>

  <!-- A list only where the material is one. -->
  <ul>
    <li><!-- slot: list-item --></li>
  </ul>

  <!-- Delete unless someone actually said this. -->
  <blockquote>
    <p><!-- slot: quote --></p>
    <cite><!-- slot: quote-attribution --></cite>
  </blockquote>

  <!-- A table where the material is a comparison; keep the scope attributes.
       Delete the whole figure otherwise. The table scrolls sideways on a
       phone, and a scroll box holding nothing focusable cannot be scrolled by
       keyboard - so tabindex and the label are not optional. Name what the
       table compares; it is read instead of the caption, not as well as it. -->
  <figure tabindex="0" role="region" aria-label="slot:table-label">
    <table>
      <caption><!-- slot: table-caption --></caption>
      <thead>
        <tr>
          <th scope="col"><!-- slot: column-heading --></th>
          <th scope="col"><!-- slot: column-heading-2 --></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row"><!-- slot: row-heading --></th>
          <td><!-- slot: cell --></td>
        </tr>
      </tbody>
    </table>
  </figure>
</div>

<!-- ================================================================
     section 5 of 9 : pull-quote v1
     A line lifted out of the running text and set large between two
     runs of body copy - the article's own words, repeated for
     emphasis, with no attribution and no ask.
     needs: one sentence taken word for word from the body copy on
     the same page, short enough to read in one glance, and carrying
     an idea rather than a fact. It is repetition on purpose: the
     line must already be somewhere above or below it, and shortening
     it to fit means shortening the sentence in the body too
     slots:
       quote              text, about 12 word(s). Sample: A sample sentence lifted out of the preview copy and se...
     ================================================================ -->

<!-- Between two runs of body copy, never at the top of a piece. The words are
     already in the article, so this element is hidden from screen readers -
     keep aria-hidden or the sentence is read out twice. Nothing that takes
     focus goes inside it: a link here is reachable by keyboard and unnameable
     by a screen reader. A quote needing a name beside it is quote-feature. -->
<aside class="pull-quote" aria-hidden="true">
  <p class="pull-quote-claim"><!-- slot: quote --></p>
</aside>

<!-- ================================================================
     section 7 of 9 : author-note v1
     The block at the foot of a written piece - the writer's name,
     their standing, one paragraph of biography and an optional link
     to more of their work, on a panel that carries its weight
     without a portrait.
     needs: the name of the person who actually wrote the piece and
     is willing to be named; what they do that bears on this subject
     - the job, the qualification, the years, the body they belong
     to; one paragraph of biography naming things a reader could go
     and check; and, where a page of their other work exists, a link
     to it
     slots:
       block-heading      text, about 4 word(s). Sample: About the sample author
       author-name        text, about 3 word(s). Sample: Sample Author Name
       author-role        text, about 8 word(s). Sample: Sample standing line, for the preview render only
       author-bio         text, about 37 word(s). Sample: A sample paragraph of preview biography, long enough to...
       author-url         attribute (href): a short label, about 1 word(s)
       author-link-text   text, about 6 word(s). Sample: More sample writing from this author
     ================================================================ -->

<!-- At the foot of the writing, above the site footer. The heading names the
     block - "About the author" - and never the person: their name is the line
     under it. Delete the last paragraph where there is no page of the author's
     other work to send a reader to. -->
<aside class="author-note" aria-labelledby="author-note-heading">
  <h2 class="author-note-heading" id="author-note-heading"><!-- slot: block-heading --></h2>
  <p class="author-note-name"><!-- slot: author-name --></p>
  <p class="author-note-role"><!-- slot: author-role --></p>
  <p class="author-note-bio"><!-- slot: author-bio --></p>
  <p class="author-note-more"><a class="author-note-link" href="slot:author-url"><!-- slot: author-link-text --></a></p>
</aside>

<!-- ================================================================
     section 8 of 9 : cta-band v5
     Plain full-bleed closing call to action on a choice of four
     grounds - a centred claim, one supporting line and one control;
     the ordinary page finale, and the section most pages on a brand
     have in common.
     needs: a closing headline and one supporting line of real copy,
     both saying something the page has earned the right to say
     slots:
       cta-band-id        attribute (aria-labelledby/id): a page-unique id drawn from the heading
       eyebrow            text, about 2 word(s). Sample: Sample eyebrow
       title              text, about 5 word(s). Sample: Sample closing headline for preview
       lead               text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
     ================================================================ -->

<!-- Place as the page's last content block, before the footer. Delete the
     eyebrow when there is nothing true to put in it. -->
<section class="cta-band cta-band--brand" aria-labelledby="slot:cta-band-id">
  <div class="cta-band-inner">
    <p class="cta-band-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="cta-band-title" id="slot:cta-band-id"><!-- slot: title --></h2>
    <p class="cta-band-lead"><!-- slot: lead --></p>
    <a class="cta-band-btn" href="{{join.url}}">{{join.text}}</a>
  </div>
</section>

<!-- ================================================================
     section 9 of 9 : colophon v2
     The site footer a page carries itself - the brand's footer menu,
     the four legal links and a copyright line, set small on a quiet
     ground, centred on one line or laid out in columns, with the
     brand mark above them or not; the platform fills every link, the
     page owns the markup.
     needs: the brand's name for the copyright line, and where the
     mark links to when it is shown. Every link on it is platform
     furniture
     slots:
       home-url           attribute (href): a short label, about 1 word(s)
       copyright          text, about 7 word(s). Sample: © 2026 Sample Brand. All rights reserved.
     ================================================================ -->

<!-- Place as the last element of the page body: nothing sits below it.
     The legal links and the footer menu are platform furniture; keep each
     placeholder exactly as found, never a literal URL in its place.
     {{menu.footer}} expands to the brand's managed footer menu, and on a
     brand that manages none it expands to nothing - delete the whole nav
     element then, rather than shipping an empty landmark.
     A page built without the mark may delete the whole colophon-mark element
     rather than leave a hidden image in place. Set the img width and height
     to the logo file's own pixel size; the rendered height follows the
     brand's logo height token. -->
<footer class="colophon colophon--plain colophon--line colophon--none">
  <div class="colophon-inner">
    <a class="colophon-mark" href="slot:home-url">
      <img class="colophon-logo" src="{{logo.src}}" alt="{{logo.alt}}" width="240" height="60">
    </a>
    <nav class="colophon-menu" aria-label="Footer">
      {{menu.footer}}
    </nav>
    <ul class="colophon-legal" role="list">
      <li><a href="{{footerLinks.privacyPolicyUrl}}">Privacy Policy</a></li>
      <li><a href="{{footerLinks.termsAndConditionsUrl}}">Terms &amp; Conditions</a></li>
      <li><a href="{{footerLinks.cookiesUrl}}">Cookie Policy</a></li>
      <li><a href="{{footerLinks.antiSlaveryPolicyUrl}}">Anti-Slavery Policy</a></li>
    </ul>
    <p class="colophon-copyright"><!-- slot: copyright --></p>
  </div>
</footer>
</body>
</html>

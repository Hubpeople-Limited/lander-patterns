<!-- ================================================================
     safety-detailed@1 - generated by ci/compose.py from ci/page-recipes.json.
     Never hand-edit: change the pattern or the recipe and regenerate
     with `python ci/compose.py`.

     How to use this shell:
       1. Write real copy into every slot. A content slot is an HTML comment,
          `slot: name`; an attribute slot is a literal `slot:name` value.
       2. Duplicate whatever block a pattern's own comments say to duplicate,
          one per real item - never invent content to fill a block.
       3. Strip every comment, this one included, in the same pass. A
          finished page contains no comment and no `slot:` anywhere.
       4. Keep every {{ }} token exactly as it stands, head and body: the
          platform fills them per brand and per page.
       5. page.css beside this file is the page's whole stylesheet beyond
          the brand's tokens - load it after the brand's own stylesheet,
          or merge it into the brand stylesheet unchanged.
     ================================================================ -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{metaDescription}}">
<meta name="keywords" content="{{metaKeywords}}">
<link rel="canonical" href="{{canonicalPage}}">
<link rel="icon" href="{{favicon}}">
<link rel="stylesheet" href="page.css">
</head>
<body>
<!-- ================================================================
     section 1 of 7 : masthead-nav v8
     The site header the platform menu placeholder has no styling for
     - brand mark, the generated primary navigation and the login and
     join controls, on a choice of ground, two desktop arrangements,
     three small-screen behaviours, an optional pinned bar, two
     small-screen alignments, a menu button with or without its word,
     and three bottom edges.
     needs: the brand's logo, the menu items configured on the
     platform, and two words in the brand's own language - one for
     the small-screen menu button and one for that same button while
     the menu is showing. Every other value on it is platform
     furniture
     slots:
       home-url           attribute (href): a short label, about 1 word(s)
       menu-label         text, about 2 word(s). Sample: Menu (sample)
       close-label        text, about 2 word(s). Sample: Close (sample)
     ================================================================ -->

<!-- Login and join are INSIDE the disclosure and must stay there: an open
     drawer covers the bar, so a control left outside it cannot be reached for
     as long as the menu is showing. ci/lint.py fails the build if one moves.
     The data-hub-module attribute belongs to the drawer and is inert on the
     other two, so it can be left in place or deleted either way.
     {{menu.navigation}} expands to a <ul class="canvas-navigation-menu"> the
     page cannot change. Leave it as it is; pattern.css styles the classes it
     generates. Set the img width and height to the logo file's own pixel size
     - they set its aspect ratio, and --logo-height sets how tall it renders. -->
<header class="masthead-nav masthead-nav--plain masthead-nav--inline masthead-nav--drawer masthead-nav--static masthead-nav--menu-start masthead-nav--side-end masthead-nav--labelled masthead-nav--rule">
  <div class="masthead-nav-inner">
    <a class="masthead-nav-mark" href="slot:home-url">
      <img class="masthead-nav-logo" src="{{logo.src}}" alt="{{logo.alt}}" width="240" height="60">
    </a>
    <details class="masthead-nav-disclosure" data-hub-module="drawer">
      <summary class="masthead-nav-toggle">
        <span class="masthead-nav-toggle-text"><!-- slot: menu-label --></span>
        <span class="masthead-nav-toggle-text masthead-nav-toggle-text--close"><!-- slot: close-label --></span>
        <span class="masthead-nav-toggle-icon" aria-hidden="true"></span>
      </summary>
      <div class="masthead-nav-tray">
        <nav class="masthead-nav-links" aria-label="Primary">
          {{menu.navigation}}
        </nav>
        <div class="masthead-nav-controls">
          <a class="masthead-nav-login" href="{{login.url}}">{{login.text}}</a>
          <a class="masthead-nav-join" href="{{join.url}}">{{join.text}}</a>
        </div>
      </div>
    </details>
  </div>
</header>

<!-- ================================================================
     section 2 of 7 : hero-stated v4
     variant: ground=deep
     An opener made of words - a display claim, one supporting line
     and the join control - on a choice of three grounds and two
     alignments, with no photograph anywhere in it.
     needs: a headline the brand can stand behind and one supporting
     sentence that says something the headline does not. Nothing else
     - no photograph, no figure, no logo. This is the opener for a
     brand that has words and nothing else yet
     slots:
       eyebrow            text, about 2 word(s). Sample: Sample eyebrow
       headline           text, about 7 word(s). Sample: A sample headline for preview, set large
       subhead            text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
       assurance          markup, about 4 words of copy; uses cta-assurance, whose CSS is in page.css; shape it like this sample:
                          <ul class="cta-assurance" role="list"><li
                          class="cta-assurance-item">Sample assurance</li><li
                          class="cta-assurance-item">Sample assurance</li></ul>
     ================================================================ -->

<!-- Delete the eyebrow when nothing true fills it; drop cta-assurance into
     the assurance slot. -->
<section class="hero-stated hero-stated--deep">
  <div class="hero-stated-inner">
    <p class="hero-stated-eyebrow"><!-- slot: eyebrow --></p>
    <h1 class="hero-stated-title"><!-- slot: headline --></h1>
    <p class="hero-stated-sub"><!-- slot: subhead --></p>
    <div class="hero-stated-cta">
      <a class="hero-stated-btn" href="{{join.url}}">{{join.text}}</a>
      <!-- slot: assurance -->
    </div>
  </div>
</section>

<!-- ================================================================
     section 3 of 7 : claim-stack v3
     variant: ground=plain
     Three to five promises set very large, one to a screenful,
     separated by hairlines and nothing else - the section with
     nowhere to hide, for words the brand can stand behind.
     needs: three to five claims the brand genuinely stands behind,
     each true, each said in about twelve words or fewer, and each
     carrying something the one above it did not. An optional line of
     plain support under any of them where a claim needs a condition
     stating. Nothing else - no figures, no photographs, no logos
     slots:
       section-id         attribute (aria-labelledby/id): a page-unique id drawn from the heading
       section-title      text, about 3 word(s). Sample: Sample section heading
       claim              text, about 8 word(s). Sample: A sample promise, set large for the preview.
       claim-note         text, about 8 word(s). Sample: One sample line of supporting detail, preview only.
     ================================================================ -->

<!--
     Duplicate the whole claim-stack-item for each claim. Three is the floor
     and five the ceiling: this is a punctuation mark, not a page.

     Delete the claim-stack-note when a claim needs no condition stating.
     Most do not, and a note under every claim turns the device into a
     two-column list with extra steps. -->
<section class="claim-stack claim-stack--plain" aria-labelledby="slot:section-id">
  <h2 class="claim-stack-heading" id="slot:section-id"><!-- slot: section-title --></h2>
  <div class="claim-stack-inner">
    <div class="claim-stack-item">
      <p class="claim-stack-claim"><!-- slot: claim --></p>
      <p class="claim-stack-note"><!-- slot: claim-note --></p>
    </div>
  </div>
</section>

<!-- ================================================================
     section 4 of 7 : safety-protections v4
     Categorised safety protections as cards, each carrying three
     registers - the name of the protection, what it does, and the
     line the reader takes away about how it protects them.
     needs: real protections the brand actually operates, each with
     the name it is known by, one or two plain sentences of what it
     does, and one sentence saying what that means for the reader; a
     section heading. Nothing here may be invented - a protection
     written because it sounds right is a promise about someone's
     physical safety that nobody is keeping
     slots:
       section-id         attribute (aria-labelledby/id): a page-unique id drawn from the heading
       section-title      text, about 3 word(s). Sample: Sample protections heading
       section-intro      text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
       protection-name    text, about 3 word(s). Sample: Sample protection name
       protection-what    text, about 17 word(s). Sample: One or two plain sentences saying what the brand actual...
       effect-label       text, about 3 word(s). Sample: Sample takeaway label
       protection-effect  text, about 9 word(s). Sample: One sentence of sample copy giving the reader-facing co...
     ================================================================ -->

<!-- section-id: draw it from the heading. Several of these may sit on one
     page, one per category, so every id must differ. -->
<section class="safety-protections" aria-labelledby="slot:section-id">
  <div class="safety-protections-inner">
    <!-- Delete the h2 and its aria-labelledby only when heading-block sits
         directly above. Delete the intro when there is nothing true to say. -->
    <h2 class="safety-protections-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <p class="safety-protections-intro"><!-- slot: section-intro --></p>
    <ul class="safety-protections-list" role="list">
      <!-- ONE protection; duplicate the whole <li> per real protection. The
           three registers are not interchangeable, and effect-label is the
           same words on every card - a column header, not a sentence. See patterns/safety-protections/README.md before filling any of it. -->
      <li class="safety-protections-item">
        <h3 class="safety-protections-name"><!-- slot: protection-name --></h3>
        <p class="safety-protections-what"><!-- slot: protection-what --></p>
        <p class="safety-protections-effect">
          <span class="safety-protections-effect-label"><!-- slot: effect-label --></span>
          <!-- slot: protection-effect -->
        </p>
      </li>
    </ul>
  </div>
</section>

<!-- ================================================================
     section 5 of 7 : link-cluster v6
     variant: ground=soft
     A wrapping run of plain links to real pages - places,
     categories, topics - on a choice of three grounds, with no
     photograph, no figure and nothing to invent.
     needs: real destination pages that already exist and already
     have content on them, and the brand's own name for each. Nothing
     else - no image, no copy, no figure. Every link must resolve: a
     cluster pointing at pages that are missing or empty is worse
     than no cluster, because it tells a reader the brand is bigger
     than it is
     slots:
       section-id         attribute (aria-labelledby/id): a page-unique id drawn from the heading
       section-title      text, about 3 word(s). Sample: Sample cluster heading
       section-intro      text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
       link-url           attribute (href): a short label, about 1 word(s)
       link-text          text, about 2 word(s). Sample: Sample link
     ================================================================ -->

<!-- Two clusters on one page read well when they run on different grounds and
     hold different kinds of thing - places, then categories. Every section-id
     must differ: two clusters sharing one id collide, and both regions get
     announced with the first heading's name.

     ONE link. Duplicate the whole <li>; ten to twenty-five is the useful
     range. Below ten it reads as a short menu rather than a map; above
     twenty-five nobody scans it. Delete the intro when nothing true fills it. -->
<section class="link-cluster link-cluster--soft" aria-labelledby="slot:section-id">
  <div class="link-cluster-inner">
    <h2 class="link-cluster-title" id="slot:section-id"><!-- slot: section-title --></h2>
    <p class="link-cluster-intro"><!-- slot: section-intro --></p>
    <ul class="link-cluster-list" role="list">
      <li class="link-cluster-item">
        <a class="link-cluster-link" href="slot:link-url"><!-- slot: link-text --></a>
      </li>
    </ul>
  </div>
</section>

<!-- ================================================================
     section 6 of 7 : cta-band v4
     Plain full-bleed closing call to action on the brand colour - a
     centred claim, one supporting line and one control; the ordinary
     page finale the library had no answer for.
     needs: a closing headline and one supporting line of real copy,
     both saying something the page has earned the right to say
     slots:
       cta-band-id        attribute (aria-labelledby/id): a page-unique id drawn from the heading
       eyebrow            text, about 2 word(s). Sample: Sample eyebrow
       title              text, about 5 word(s). Sample: Sample closing headline for preview
       lead               text, about 9 word(s). Sample: One supporting sentence, used only to render this preview.
     ================================================================ -->

<!-- Place as the page's last content block, before the footer. Delete the
     eyebrow when there is nothing true to put in it. -->
<section class="cta-band" aria-labelledby="slot:cta-band-id">
  <div class="cta-band-inner">
    <p class="cta-band-eyebrow"><!-- slot: eyebrow --></p>
    <h2 class="cta-band-title" id="slot:cta-band-id"><!-- slot: title --></h2>
    <p class="cta-band-lead"><!-- slot: lead --></p>
    <a class="cta-band-btn" href="{{join.url}}">{{join.text}}</a>
  </div>
</section>

<!-- ================================================================
     section 7 of 7 : colophon v1
     The site footer a page carries itself - the brand's footer menu,
     the four legal links and a copyright line, set small on a quiet
     ground; the platform fills every link, the page owns the markup.
     needs: the brand's name for the copyright line. Every link on it
     is platform furniture
     slots:
       copyright          text, about 7 word(s). Sample: © 2026 Sample Brand. All rights reserved.
     ================================================================ -->

<!-- Place as the last element of the page body: nothing sits below it.
     The legal links and the footer menu are platform furniture; keep each
     placeholder exactly as found, never a literal URL in its place.
     {{menu.footer}} expands to the brand's managed footer menu, and on a
     brand that manages none it expands to nothing - delete the whole nav
     element then, rather than shipping an empty landmark. -->
<footer class="colophon colophon--plain">
  <div class="colophon-inner">
    <nav class="colophon-menu" aria-label="Footer">
      {{menu.footer}}
    </nav>
    <ul class="colophon-legal" role="list">
      <li><a href="{{footerLinks.privacyPolicyUrl}}">Privacy Policy</a></li>
      <li><a href="{{footerLinks.termsAndConditionsUrl}}">Terms &amp; Conditions</a></li>
      <li><a href="{{footerLinks.cookiesUrl}}">Cookie Policy</a></li>
      <li><a href="{{footerLinks.antiSlaveryPolicyUrl}}">Anti-Slavery Policy</a></li>
    </ul>
    <p class="colophon-copyright"><!-- slot: copyright --></p>
  </div>
</footer>
</body>
</html>
